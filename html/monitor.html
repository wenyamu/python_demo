<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervisor 进程监控（WebSockets + Nunjucks纯前端模板）</title>
<style>
  
  /* ========== 1. 全局变量：默认深色（你现在的夜晚主题） ========== */
  :root {
    --bg: #0f1115;
    --bg-card: #1a1d23;
    --bg-elevated: #22262e;
    --bg-hover: #282d36;
    --border: #2a2f38;
    --text-primary: #e4e6eb;
    --text-secondary: #8b92a1;
    --scrollbar: #3a3f4b;
    --fatal-bg: #2d1b1b;
    --flap-warn-bg: #ef444415;
    --shadow-soft: 0 2px 8px rgba(0,0,0,0.1);
    --halo-opacity: 1;
  }

  /* ========== 2. 浅色（白天主题）覆盖变量 ========== */
  html[data-theme="light"] {
    --bg: #f5f7fa;
    --bg-card: #ffffff;
    --bg-elevated: #f8f9fb;
    --bg-hover: #f3f4f6;
    --border: #e5e7eb;
    --text-primary: #1f2937;
    --text-secondary: #6b7280;
    --scrollbar: #d1d5db;
    --fatal-bg: #fef2f2;
    --flap-warn-bg: #fef2f2;
    --shadow-soft: 0 2px 12px rgba(0,0,0,0.06);
    --halo-opacity: 0.8;
  }

  /* ========== 3. 全局平滑切换，改色不生硬 ========== */
  * {
    box-sizing: border-box; margin: 0; padding: 0;
    transition: background-color 0.2s ease, color 0.2s ease,
                border-color 0.2s ease, box-shadow 0.2s ease;
  }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text-primary);
    padding: 12px 22px; min-height: 100vh;
  }

  /* ========== 4. 标题栏：加了主题切换按钮位置 ========== */
  .page-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  
  .back-link {
      padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 13px; cursor: pointer;
      text-decoration: none;
  }
  .back-link:hover { background: var(--bg-hover); }
  
  h1 { font-size: 22px; font-weight: 600; }
  
  /* 头部按钮组：主题切换和布局切换并排，间距一致 */
  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  
  /* 主题切换按钮 */
  .layout-toggle {
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-primary);
    font-size: 16px; cursor: pointer;
  }
  .layout-toggle:hover { background: var(--bg-hover); }

  /* ========== 5. 概览卡片 ========== */
  .overview {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 16px;
    padding: 10px 16px;
    background: var(--bg-card);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .stat-item {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px;
    border-right: 1px solid var(--border);
  }
  .stat-item:last-child { border-right: none; }
  .stat-icon { font-size: 18px; }
  .stat-label { font-size: 14px; color: var(--text-secondary); }
  .stat-value {
    font-size: 18px; font-weight: 700;
    font-family: Consolas, monospace;
  }
  .stat-value.green { color: #22c55e; }
  .stat-value.red { color: #ef4444; }
  .stat-value.blue { color: #3b82f6; }
  .stat-value.orange { color: #f59e0b; }
  .stat-value.gray { color: var(--text-secondary); }

  /* ========== 6. 服务器卡片 ========== */
  .server-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));/* 列数自动 */
    /* grid-template-columns: repeat(3, 1fr);固定3列 */
    gap: 20px;
  }
  
  .server-card {
    background: var(--bg-card); border-radius: 10px;
    border: 1px solid var(--border); overflow: hidden;
    box-shadow: var(--shadow-soft);
    position: relative;/* 加相对定位，给蒙版当父级，不加则蒙版就加在整个页面 */
  }
  
  /* 加loading类时显示半透明蒙版 */
  .server-card.loading::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4); /* 半透明黑灰蒙版 */
      border-radius: 0 0 8px 8px;
      z-index: 10;
      /* 简单的淡入淡出 */
      animation: fadeIn 0.1s ease-in;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  .server-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 18px; background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    
  }
  
  .server-actions {
    margin-left: auto;
  }
  .server-actions button{
    font-size: 14px;
  }
  
  .server-title { display: flex; align-items: center; gap: 8px; }
  .server-title h3 { font-size: 16px; font-weight: 600; }
  .server-ip { font-size: 14px; color: var(--text-secondary); font-weight: normal; margin-left: 4px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; }
  .connected { background: #22c55e; box-shadow: 0 0 8px #22c55e66; }
  .disconnected { background: #ef4444; }
  
  /* 单节点的统计条，放头部下方、进程列表上方 */
  .server-stats-bar {
      display: flex;
      gap: 6px;
      padding: 8px 18px;
      background: var(--bg-elevated);
      align-items: center;
      font-size: 16px;
      color: var(--text-secondary);
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
  }
  .server-stats-bar span { font-weight: 600; }
  
  .count-total { color: #3b82f6; font-weight: 600; padding-right: 10px}
  .count-running { color: #22c55e; font-weight: 600; padding-right: 10px}
  .count-stopped { color: var(--text-secondary); font-weight: 600; padding-right: 10px}
  .count-error { color: #ef4444; font-weight: 600; padding-right: 10px}
  .count-flap { color: #f59e0b; font-weight: 600; padding-right: 10px}
  
  .server-config {
      display: flex;
      gap: 6px;
      padding: 8px 18px;
      background: var(--bg-elevated);
      align-items: center;
      font-size: 16px;
      color: var(--text-secondary);
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
  }
  
  /* ========== 7. 进程列表 ========== */
  /* 列表排序按钮 */
  /* 列表按照 flapping - FATAL/BACKOFF - STOPPED/EXITED - RUNNING 的顺序依次向下排列，由 order 定义 */
  .sort-enabled .proc-list {
      display: flex; flex-direction: column; /* 这两项是排列必要设置 */
  }
  .sort-enabled .proc-RUNNING {
      order: 4;/* 排列4 */
  }
  .sort-enabled .proc-STOPPED, .sort-enabled .proc-EXITED {
      order: 3;/* 排列3 */
  }
  .sort-enabled .proc-FATAL, .sort-enabled .proc-BACKOFF {
      order: 2;/* 排列2 */
  }
  .sort-enabled .proc-item.flapping {
      order: 1;/* 排列1 */
  }
  
  /* 连接失败提示 */
  .error-tip {
      padding: 20px; color: #ef4444; text-align: center;
      font-size: 15px;
      background: var(--fatal-bg);
  }
  /* 列表默认排序 */
  .proc-list {
      max-height: 500px;
      overflow-y: auto; 
      padding: 18px 18px 9px 18px; 
  }
  
  .proc-list::-webkit-scrollbar { width: 5px; }
  .proc-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
  
  .proc-item {
    background: var(--bg-elevated); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 8px;
    border-left: 4px solid var(--border); transition: background 0.2s;
  }
  .proc-item:hover { background: var(--bg-hover); }
  
  .proc-RUNNING {
      border-left-color: #22c55e;
  }
  .proc-STARTING { border-left-color: #3b82f6; }
  .proc-STOPPING { border-left-color: #f59e0b; }
  
  .proc-STOPPED, .proc-EXITED {
      border-left-color: #6b7280; 
  }
  
  .proc-FATAL, .proc-BACKOFF {
      border-left-color: #ef4444; 
      background: var(--fatal-bg);
  }

  /* ========== 8. Flapping 橙色呼吸动画（颜色自动适配主题） ========== */
  .proc-item.flapping {
    border: 2px solid #f59e0b;
    border-left-width: 4px;
    background: #f59e0b22;
    animation: crash-pulse 1.4s ease-in-out infinite;
  }
  @keyframes crash-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, calc(0.25 * var(--halo-opacity))); }
    50%      { box-shadow: 0 0 16px 5px rgba(245, 158, 11, calc(0.5 * var(--halo-opacity))); }
  }

  .flap-badge {
    display: inline-block;
    background: #ef4444; color: #fff;
    font-size: 14px; font-weight: 700;
    padding: 2px 6px; border-radius: 3px;
    margin-left: 6px;
    animation: crash-pulse 1.4s ease-in-out infinite;
  }
  .flap-warn {
    font-size: 15px; color: #ef4444; font-weight: 600;
    margin-bottom: 8px; padding: 4px 8px;
    background: var(--flap-warn-bg);
    border-radius: 4px; border-left: 3px solid #ef4444;
    display: flex; justify-content: space-between; align-items: center;
  }
  .flap-warn .ack-btn-inline {
    padding: 2px 8px; border: none; border-radius: 3px;
    background: #22c55e; color: #fff;
    font-size: 14px; cursor: pointer; font-weight: 600;
    white-space: nowrap;
  }
  .flap-warn .ack-btn-inline:hover { background: #16a34a; }

  /* ========== 9. 进程信息 ========== */
  .proc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .proc-name { font-size: 17px; font-weight: 600; word-break: break-all; color: var(--text-primary); }
  .proc-pid { margin-left: 6px;font-size: 15px; color: var(--text-secondary); font-family: Consolas, monospace; white-space: nowrap; }
  .proc-status { font-size: 15px; padding: 2px 8px; border-radius: 4px; font-weight: 500; display: inline-block; margin-left: 6px; }
  .status-RUNNING { background: #22c55e22; color: #22c55e; }
  .status-STARTING { background: #3b82f622; color: #3b82f6; }
  .status-STOPPING { background: #f59e0b22; color: #f59e0b; }
  .status-STOPPED, .status-EXITED { background: #6b728022; color: #9ca3af; }
  .status-FATAL, .status-BACKOFF { background: #ef444422; color: #ef4444; }
  .proc-desc { font-size: 15px; color: var(--text-secondary); margin-bottom: 8px; }
  .proc-error { font-size: 15px; color: #ef4444; margin-bottom: 8px; }

  /* ========== 10. 操作按钮 ========== */
  .proc-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    padding: 4px 10px; border: none; border-radius: 4px;
    font-size: 15px; cursor: pointer; font-weight: 500; transition: all 0.15s;
    background: var(--bg-elevated);color: var(--text-primary);
  }
  .btn:hover { background: var(--bg-hover); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-start { background: #22c55e22; color: #22c55e; }
  .btn-start:not(:disabled):hover { background: #22c55e; color: #fff; }
  .btn-stop { background: #ef444422; color: #ef4444; }
  .btn-stop:not(:disabled):hover { background: #ef4444; color: #fff; }
  .btn-restart { background: #f59e0b22; color: #f59e0b; }
  .btn-restart:not(:disabled):hover { background: #f59e0b; color: #fff; }
  
  .btn-reload { background: #3b82f622; color: #3b82f6; }
  .btn-reload:not(:disabled):hover { background: #3b82f6; color: #fff; }
  
  /* 刷新按钮样式 */
  .btn-refresh-node {
      background: #3b82f622; color: #3b82f6;
      margin-left: auto;
      
  }
  .btn-refresh-node:hover:not(:disabled) { background: #3b82f6; color: #fff; }
  .btn-refresh-node:disabled svg { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  
  /* supervisor 重启按钮 */
  .btn-supervisor-restart {
    background: #ef444422; color: #ef4444;
    border: 1px solid #ef444466;
    padding: 5px 10px; border-radius: 4px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    flex-shrink: 0; margin-left: 2px; transition: all 0.15s;
  }
  .btn-supervisor-restart:hover:not(:disabled) { background: #ef4444; color: white; }
  .btn-supervisor-restart:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ========== 11. 排序按钮加小问号?提示 ========== */
  /* 问号小圆圈 */
  .help-icon {
      display: none;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      margin-left: 5px;
      margin-bottom: 4px;
      border-radius: 50%;
      background: #3a3f4b;
      color: #c9cdd6;
      font-size: 10px;
      font-weight: 700;
      cursor: help;
      position: relative;      /* 给气泡当定位父级 */
      vertical-align: middle;
  }
  
  /* ★只有开了排序（html有.sort-enabled）时，问号才显示 */
  .sort-enabled .help-icon {
      display: inline-flex;
  }

  /* 气泡本体（用 data-tip 的内容自动填充） */
  .help-icon::after {
      content: attr(data-tip);
      position: absolute;
      top: 150%;                 /* 显示在问号下方 */
      left: 50%;
      transform: translateX(-50%);
      background: #22262e;
      color: #e4e6eb;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
      padding: 6px 10px;
      border-radius: 6px;
      white-space: normal;
      width: max-content;
      max-width: 260px;              /* 文字长也不怕超出 */
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
      opacity: 0;
      visibility: hidden;
      transition: opacity .15s ease, visibility .15s ease;
      pointer-events: none;          /* 气泡不挡鼠标事件 */
      z-index: 999;
  }

  /* 鼠标移上去显示 */
  .help-icon:hover::after,
  .help-icon:hover::before {
      opacity: 1;
      visibility: visible;
  }
  
  /* ========== 12. 倒计时设置 ========== */
  /* 倒计时样式 */
  .refresh-countdown {
      position: relative;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0.8;
      vertical-align: middle;
      --duration: 5s;/* 默认5秒，使用 style="--duration: 10s 覆盖默认设置 */
  }
  .refresh-countdown-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
  }
  .refresh-ring-bg {
      fill: none;
      stroke: rgba(0,0,0,0.1);
      stroke-width: 3;
  }
  .refresh-ring-progress {
      fill: none;
      stroke: #3b82f6;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 88;
      stroke-dashoffset: 0;
      /* ★ 核心：时长用CSS变量，改 --duration 就改了动画时长，infinite自动无限循环 */
      animation: ringCountdown var(--duration) linear infinite;
  }
  
  [data-theme="dark"] .refresh-ring-bg { stroke: rgba(255,255,255,0.15); }
  
  @keyframes ringCountdown {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 88; }
  }
  
  /* ========== 13. 响应式 ========== */
  @media (max-width: 1300px) {
      .server-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
      .server-grid { grid-template-columns: 1fr; }
      body { padding: 12px; }
      .server-stats-bar { flex-wrap: wrap; gap: 4px; font-size: 14px;}/**/
      .server-stats-bar span { font-weight: 400; }
      
      .server-actions {
        margin-left: auto;
      }
      .server-actions button{
        font-size: 12px;
      }
      .server-title h3 { font-size: 14px; font-weight: 400; }
  }
  
  /* ========== 减少动效适配 ========== */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation-duration: 0.01ms !important; }
  }
  
  /* ==============================================
     ===== 瀑布流新增 开始（原有样式完全未动）=====
     ============================================== */
  
  /* 瀑布流模式核心：容器改相对定位，卡片绝对定位，JS计算位置 */
  .server-grid.masonry {
    position: relative !important;
    display: block !important; /* 覆盖原有grid */
    width: 100%;
    /* 高度由JS计算后设置，不用写死 */
  }
  /* 瀑布流下卡片规则：绝对定位，宽度由JS动态计算 */
  .server-grid.masonry > .server-card {
    position: absolute;
    transition: top 0.2s ease, left 0.2s ease; /* 切换动画更顺滑 */
    margin: 0 !important; /* 覆盖原margin，间距交给JS gap */
  }
  /* 瀑布流下列表默认高度重置 */
  .server-grid.masonry > .server-card > .proc-list {
      max-height: none; 
  }
  
  /* 瀑布流响应式：和原有grid列数对应 */
  @media (max-width: 1300px) {
    .server-grid.masonry { column-count: 2; } /* 中屏2列 */
  }
  @media (max-width: 768px) {
    .server-grid.masonry { column-count: 1; } /* 窄屏1列 */
  }
  /* ===== 瀑布流新增 结束 ===== */
  
  
  /* ========== 全局状态筛选样式 ========== */
  .stat-item {
    cursor: pointer;
    transition: background 0.2s ease;
    border-radius: 4px;
  }
  .stat-item:hover {
    background: rgba(255,255,255,0.1);
  }
  .stat-item.active[data-filter="ALL_NODES"] {
    background: rgba(0,0,0,0.2);
  }
  .stat-item.active[data-filter="ONLINE_NODES"] {
    background: rgba(34,197,94,0.2);
  }
  .stat-item.active[data-filter="OFFLINE_NODE"] {
    background: rgba(239,68,68,0.2);
  }
  .stat-item.active[data-filter="ALL_PROCS"] {
    background: rgba(59,130,246,0.2);
  }
  .stat-item.active[data-filter="RUNNING"] {
    background: rgba(34,197,94,0.2);
  }
  .stat-item.active[data-filter="STOPPED"] {
    background: rgba(107,114,128,0.2);
  }
  .stat-item.active[data-filter="FATAL"] {
    background: rgba(239,68,68,0.2);
  }
  .stat-item.active[data-filter="FLAPPING"] {
    background: rgba(249,115,22,0.2);
  }
  
  
</style>

<!-- 引入Nunjucks模板引擎，纯浏览器运行，不需要后端，本地双击打开也能跑 -->
<script src="https://cdn.jsdelivr.net/npm/nunjucks@3.2.4/browser/nunjucks.min.js"></script>

<!-- ==================== Nunjucks模板定义区 开始 ==================== -->
<!-- 1. 服务器节点卡片模板（和Jinja2语法几乎完全一致） -->
<script type="text/nunjucks" id="serverCardTpl">
<div class="server-card" id="card-{{ serverKey }}" data-node="{{serverKey}}" data-nodename="{{server.nodename}}">
    
    {% if connected %}
    
    <div class="server-header">
        <div class="server-title">
            <span class="status-dot connected" id="dot-{{ serverKey }}"></span>
            <h3>
                <a href="?node={{ serverKey }}&nodename={{ server.nodename }}" 
                   class="btn btn-node-detail" 
                   onclick="window.open(this.href, '_self'); return false;" 
                   style="font-size: 16px; font-weight: 600;padding: 0;text-decoration: none;">
                   {{ server.nodename }}
                </a>
                <span class="server-ip">{{ server.ip }}:{{ server.port }}</span>
            </h3>
            <div id="refresh-{{ serverKey }}"></div>
        </div>
        <div class="server-actions">
            <button class="btn btn-supervisor-restart" id="btn-restart-sv-{{ serverKey }}" onclick="restartSupervisor('{{ serverKey }}')">⚠︎ 重启 Supervisor</button>
        </div>
    </div>
    <div class="server-stats-bar">
        <span class="count-total" style="background: #3b82f622; color: #3b82f6;padding: 2px 10px; border-radius: 4px;margin-right:8px" id="total-{{ serverKey }}">0</span>
        运行<span class="count-running" id="run-{{ serverKey }}">0</span>
        终止<span class="count-stopped" id="stop-{{ serverKey }}">0</span>
        异常<span class="count-error" id="err-{{ serverKey }}">0</span>
        抖动<span class="count-flap" id="flap-{{ serverKey }}">0</span>
        <div class="server-actions">
            <button class="btn btn-refresh-node" id="btn-refresh-{{ serverKey }}" onclick="refreshNode('{{ serverKey }}')" title="更新当前节点（包括重新加载配置）">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-bottom:4px;">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                </svg>
                更新
            </button>
        </div>
    </div>
      
      {% if singleNode %}
        <div class="proc-list" id="procs-{{ serverKey }}" style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 0 10px;
            align-items: start;
            max-height: 600px;">
        </div>
      {% else %}
        <div class="proc-list" id="procs-{{ serverKey }}"></div>
      {% endif %}
      
    {% else %}
    
    <div class="server-header">
        <div class="server-title">
            <span class="status-dot disconnected" id="dot-{{ serverKey }}"></span>
            <h3>
                {{ server.nodename }}
                <span class="server-ip">{{ server.ip }}:{{ server.port }}</span>
            </h3>
            <div id="refresh-{{ serverKey }}"></div>
        </div>
    </div>
    <div class="proc-list" id="procs-{{ serverKey }}"><p class="error-tip">⚠ 服务器连接失败</p></div>
    
    {% endif %}
    
</div>
</script>

</head>

  <div class="overview">

<!-- ==================== js 代码区 ==================== -->
<script>
  
  // 全局变量：是否点击按钮重启 supervisor，是为了防止重启时，节点直接断连界面不美观，所以加了个开关
  let isRestart = false;
  
  /* ============== 服务器列表：改成你自己的节点 ==============*/
  let servers = [
      { nodename: "本地01", ip: "192.168.1.121", port: 8765 },
      { nodename: "北京01", ip: "192.168.1.122", port: 8765 },
      { nodename: "docker", ip: "192.168.1.121", port: 9527 },
    ];
  
  /**
   ** 单节点详情页面配置
   */
  let singleNode = false;
  
  // js 获取当前浏览器参数 ?node=192.168.1.121:8765&nodename=本地01
  const p = new URLSearchParams(location.search);
  const node = p.get('node');
  console.log("url参数：");
  console.log(node);
  
  const [ip, port] = (node || '').split(':');// 生成 数组
  
  if(node){
    servers = node ? [{ nodename: p.get('nodename') || ip, ip, port: Number(port) }] : [];
    singleNode = true;
    localStorage.setItem('masonryEnabled', false);//单节点详情页面模式，禁用瀑布流样式
  }
  /**单节点详情页面配置 结束*/
  
  
  // 初始化Nunjucks，开启自动转义防XSS，纯浏览器运行不需要后端
  nunjucks.configure({ autoescape: true });
  // 预加载所有模板
  const tplServerCard = document.getElementById('serverCardTpl').innerHTML;
  const tplProcItem   = document.getElementById('procItemTpl').innerHTML;
  const tplCountdown  = document.getElementById('countdownTpl').innerHTML;
  
  
  const serverData = {};
  let reqIdCounter = 0;
  let pendingRequests = {};
  
  // 仪表板 初始化
  function initDashboard() {
    const dashboard = document.getElementById('dashboard');
    servers.forEach(server => {
      const serverKey = `${server.ip}:${server.port}`;
      serverData[serverKey] = {nodename: server.nodename, connected: false, processes: {}, ws: null };
      
      // 使用Nunjucks渲染服务器卡片，代替原来的字符串拼接
      const cardHtml = nunjucks.renderString(tplServerCard, {
        server: server,
        serverKey: serverKey,
        connected: false,
        singleNode: singleNode
      });
      
      /* 方法1：
      const card = document.createElement('div');
      // 注意：模板里已经包含了外层server-card div，这里直接用innerHTML解析
      card.innerHTML = cardHtml;
      dashboard.appendChild(card.firstElementChild);
      */
      
      /* 方法2：
      | 位置参数 | 插入到哪 |
      | --- | --- |
      | beforebegin | 容器‌前面‌（成为同级兄弟节点） |
      | afterbegin | 容器‌内部开头‌ |
      | beforeend | 容器‌内部末尾‌（最常用，就是追加） |
      | afterend | 容器‌后面‌（成为同级兄弟节点） |
      */
      dashboard.insertAdjacentHTML('beforeend', cardHtml);
      
      connectToServer(server);
    });
    updateGlobalStats();
  }

  function connectToServer(server) {
    console.log('开始连接 server:');
    console.log(server);
    const serverKey = `${server.ip}:${server.port}`;
    const ws = new WebSocket(`ws://${server.ip}:${server.port}`);
    
    ws.onopen = () => {
      serverData[serverKey].connected = true;
      serverData[serverKey].ws = ws;
      console.log(`${server.nodename} 已连接`);
      
      /* outerHTML 直接替换整个卡片 */
      const cardEl = document.getElementById(`card-${serverKey}`);
      const cardHtml = nunjucks.renderString(tplServerCard, {
        server: server,
        serverKey: serverKey,
        connected: serverData[serverKey].connected,
        singleNode: singleNode
      });
      cardEl.outerHTML = cardHtml;
      
      updateGlobalStats();
    };

    ws.onclose = () => {
      serverData[serverKey].connected = false;
      serverData[serverKey].ws = null;
      
      /* outerHTML 直接替换整个卡片 */
      // 正常断连，正常执行，如果是点击按钮重启supervisor时，不让节点卡片UI断连
      if (!isRestart){
        const cardEl = document.getElementById(`card-${serverKey}`);
        const cardHtml = nunjucks.renderString(tplServerCard, {
          server: server,
          serverKey: serverKey,
          connected: serverData[serverKey].connected,
          singleNode: singleNode
        });
        cardEl.outerHTML = cardHtml;
      }
      
      setTimeout(() => connectToServer(server), 3000);
      updateGlobalStats();
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      
      // 定时节点全量更新时返回的数据
      if (data.type === 'full_sync') {
        const container = document.getElementById(`procs-${serverKey}`);
        container.innerHTML = '';
        serverData[serverKey].processes = {};
        data.data.forEach(proc => {
          serverData[serverKey].processes[proc.full_name] = proc;
          renderProcItem(serverKey, proc);
        });
        updateServerStats(serverKey);
        updateGlobalStats();
        return;
      }
      
      // 进程状态改变时返回的实时数据
      if (data.type === 'state_change') {
        const procName = data.process;
        const statename = data.event.replace('PROCESS_STATE_', '');//监听器实时返回的进程状态
        const existing = serverData[serverKey].processes[procName] || {};
        const wasFlapping = existing.flapping || false;
        const updated = Object.assign({}, existing, {
          full_name: procName,
          name: data.raw_process || procName.split(':').pop(),
          group: data.group || '',
          statename: statename,
          pid: data.pid || existing.pid || 0,
          flapping: !!data.flapping,
          flap_count: data.flap_count || 0,
          last_restart_ts: data.last_restart_ts || 0,
          acknowledged: !!data.acknowledged
        });
        serverData[serverKey].processes[procName] = updated;
        renderProcItem(serverKey, updated);
        
        updateServerStats(serverKey);
        updateGlobalStats();
        return;
      }
      
      // 操作单进程指令返回的执行结果数据
      if (data.type === 'command_result') {
        const cb = pendingRequests[data.req_id];
        if (cb) {
          clearTimeout(cb.timeout);
          cb.resolve(data.result);
          delete pendingRequests[data.req_id];
        }
        return;
      }
    };
  }


  /**
   * 发送控制单进程的指令
   * @param {string} serverKey ${server.ip}:${server.port}
   * @param {string} action    start stop restart
   * @param {string} proc      进程名
   */
  function sendCommand(serverKey, action, proc) {
    const ws = serverData[serverKey] && serverData[serverKey].ws;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      return Promise.resolve({ success: false, error: '节点未连接' });
    }
    const req_id = ++reqIdCounter;
    ws.send(JSON.stringify({
      type: 'command', 
      action: action, 
      process: proc, 
      req_id: req_id 
    }));
    return new Promise((resolve) => {
      pendingRequests[req_id] = {
        resolve: resolve,
        timeout: setTimeout(() => {
          resolve({ success: false, error: '请求超时' });
          delete pendingRequests[req_id];
        }, 8000)
      };
    });
  }


  /**
   * 发送控制所有进程的指令
   * @param {string} serverKey ${server.ip}:${server.port}
   * @param {string} action    start stop restart
   */
  function sendCommandAll(serverKey, action) {
    const ws = serverData[serverKey] && serverData[serverKey].ws;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      return Promise.resolve({ success: false, error: '节点未连接' });
    }
    const req_id = ++reqIdCounter;
    ws.send(JSON.stringify({
      type: 'commandAll', 
      action: action, 
      req_id: req_id 
    }));
    return new Promise((resolve) => {
      pendingRequests[req_id] = {
        resolve: resolve,
        timeout: setTimeout(() => {
          resolve({ success: false, error: '请求超时' });
          delete pendingRequests[req_id];
        }, 8000)
      };
    });
  }


  /**
   * 发送"确认已处理抖动"指令
   * @param {string} serverKey ${server.ip}:${server.port}
   * @param {string} proc      进程名
   */
  function acknowledgeFlap(serverKey, proc) {
    const ws = serverData[serverKey] && serverData[serverKey].ws;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      alert('节点未连接');
      return;
    }
    const req_id = ++reqIdCounter;
    ws.send(JSON.stringify({
      type: 'acknowledge_flap', 
      process: proc, 
      req_id: req_id 
    }));
    return new Promise((resolve) => {
      pendingRequests[req_id] = {
        resolve: resolve,
        timeout: setTimeout(() => {
          resolve({ success: false, error: '请求超时' });
          delete pendingRequests[req_id];
        }, 5000)
      };
    });
  }


  /**
   * 同时提取pid和uptime
   * @param {string} desc 描述文本 pid 123, uptime 0:00:02（null/undefined/错误文本都兼容）
   * @returns { pid: number|null, uptime: string|null, uptimeSec: number|null }
   */
  function parseProcDesc(desc) {
    const result = { pid: null, uptime: null, uptimeSec: null };
    if (typeof desc !== 'string') return result;
    
    // 提取pid
    const pidMatch = desc.match(/pid\s+(\d+)/);
    if (pidMatch) result.pid = Number(pidMatch[1]); // 123
    
    // 提取uptime
    const uptimeMatch = desc.match(/uptime\s+(\d+):(\d+):(\d+)/);
    if (uptimeMatch) {
      const [, h, m, s] = uptimeMatch;
      result.uptime = uptimeMatch[0].replace('uptime ', ''); // 拿到"0:00:02"
      result.uptimeSec = Number(h)*3600 + Number(m)*60 + Number(s); // 2
    }
    
    return result;
  }


  /**
   * 时间戳转北京时间
   * @param {number} ts   时间戳
   * @returns {string} 年-月-日 时:分:秒
   */
  function tsToBeijing(ts) {
    const d = new Date(ts * 1000);
    const p = new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    }).formatToParts(d);
    
    const g = t => p.find(x => x.type === t).value;
    return `${g('year')}-${g('month')}-${g('day')} ${g('hour')}:${g('minute')}:${g('second')}`;
  }


  /**
   * 计算两个时间戳的时长，返回 进程运行时长，天/时/分/秒 格式
   * @param {number} startTs 开始时间戳（秒或毫秒都支持）
   * @param {number} endTs 结束时间戳（秒或毫秒都支持）
   * @returns {string} 格式化后的时长，如 "0:00:02"、"1:23:45:06"（天:时:分:秒，小时不补零，分秒补两位）
   */
  function formatDuration(startTs, endTs) {
    // 1. 兼容秒/毫秒时间戳：小于1e12认为是秒级，统一转成毫秒计算
    const start = startTs < 1e12 ? startTs * 1000 : startTs;
    const end = endTs < 1e12 ? endTs * 1000 : endTs;

    // 2. 算总秒数（避免负数，结束时间小于开始时间返回0）
    let totalSec = Math.max(0, Math.floor((end - start) / 1000));

    // 3. 拆分天/时/分/秒
    const day = Math.floor(totalSec / 86400);
    totalSec %= 86400;
    const hour = Math.floor(totalSec / 3600);
    totalSec %= 3600;
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;

    // 4. 补零：时分秒固定两位，天数不补零
    const pad = n => String(n).padStart(2, '0');

    // 5. 超过24小时（有天数）才显示天，否则只有时分秒
    if (day > 0) {
      return `${day}天${pad(hour)}:${pad(min)}:${pad(sec)}`;
    }
    return `${pad(hour)}:${pad(min)}:${pad(sec)}`;
  }


  /**
   * 计算两个时间戳的时长，返回 进程运行时长，天/时/分/秒 格式
   * @param {string} oldDesc   描述 pid 77128, uptime 0:56:05
   * @param {number} newPid    新pid 由事件侦听器提供
   * @param {string} statename 进程新状态名，由事件侦听器提供
   * @param {number} start     进程开始时间戳（秒或毫秒都支持）
   * @param {number} stop      进程结束时间戳（秒或毫秒都支持）
   * @param {number} state     进程状态名编号
   * @returns {array} [pid, "0:00:00"]
   */
  function smartUpdateDesc_time(oldDesc, newPid, statename, start, stop, state) {
    const nowSec = Math.floor(Date.now() / 1000);//当时时间戳，秒
    const pid = Number(newPid);
    
    const STATE_CODE = {
        STOPPED: 0, 
        STARTING: 10, 
        RUNNING: 20, 
        BACKOFF: 30,   
        STOPPING: 40, 
        EXITED: 100, 
        FATAL: 200, 
    };
    
    // 程序未运行的状态组
    const DEAD_CODES = [STATE_CODE.STOPPED, STATE_CODE.EXITED, STATE_CODE.FATAL];
    // → [0, 100, 200]
    
    /*
     * 使用 statename 的状态判断程序的运行状态有点问题：
     * 我把某个进程停止了，然后刷新页面，再点启动按钮，会获取到另一台服务器的监听程序的 pid 和 运行时长，这很奇怪！！！
    */
    let formatText;
    if (DEAD_CODES.includes(Number(state))) {
      formatText = ["", tsToBeijing(stop) + " 终止"];   // "2026-10-30 01:10:38";
    }
    
    if (state == 20){
      formatText = [pid, "已运行 " + formatDuration(start, nowSec)];   // "3天01:10:38";
    }
    
    // 1. 新pid是0 → 这种情况针对的是刷新页面，因为 新pid 如果是由监听事件返回，其返回的 pid 不可能为0
    // 只有在刷新时 使用 全局的 pid 时才会返回 0
    if (!pid) return formatText;
    
    // 2. 事件状态改变时，只要是未正常运行，就不显示信息
    if (statename != "RUNNING")
    {
      return ["", "--"];
    }
    
    // 3. 新旧pid对比
    const m = oldDesc.match(/pid\s+(\d+)/);
    const oldPid = m ? Number(m[1]) : "";//提取pid值
    // 新旧pid相同则 uptime 继续涨
    if (oldPid === pid) return formatText;//刷新页面时
    // 此时程序刚启动，只会返回 pid 123456，这里我把它改变了一下
    return [pid, "0:00:00"];//状态改变时
    
  }
  
  
  /**
   * 渲染进程列表
   * @param {string} serverKey ${server.ip}:${server.port}
   * @param {string} proc      进程名
   */
  function renderProcItem(serverKey, proc) {
    const container = document.getElementById('procs-' + serverKey);
    const domId = 'proc-' + serverKey + '-' + proc.full_name;
    let el = document.getElementById(domId);
    if (!el) {
      el = document.createElement('div');
      el.id = domId;
      el.className = 'proc-item';
      container.appendChild(el);
    }
    
    const isRunning      = proc.statename === 'RUNNING';
    const isTransit      = ['STARTING', 'STOPPING'].indexOf(proc.statename) !== -1;
    const disableStart   = isRunning || isTransit;//已经运行 或 在过渡状态时，禁用启动按钮
    const disableStop    = !isRunning || isTransit;//未运行 或 在过渡状态时，禁用停止按钮
    const disableRestart = !isRunning || isTransit;//未运行 或 在过渡状态时，禁用重启按钮
    const isFlapping     = !!proc.flapping;//进程抖动
    
    const classes = ['proc-item', 'proc-' + proc.statename];
    if (isFlapping) classes.push('flapping');//向 classes 追加 抖动类名
    el.className = classes.join(' ');// 以空格分隔生成 class="proc-item proc-STOPPED flapping"
    
    // 显示非0退出码，异常退出
    let errorText = '';
    if (['FATAL', 'BACKOFF', 'EXITED', 'STOPPED'].includes(proc.statename) && proc.exitstatus && proc.exitstatus !== 0) {
        errorText = `退出码: ${proc.exitstatus}`;
    }
    
    const desc_arr = smartUpdateDesc_time(proc.description, proc.pid, proc.statename, proc.start, proc.stop, proc.state);
    
    // 使用Nunjucks渲染进程项，代替原来的字符串拼接
    el.innerHTML = nunjucks.renderString(tplProcItem, {
      serverKey: serverKey,
      proc: proc,
      descArr: desc_arr,
      isRunning: isRunning,
      isTransit: isTransit,
      disableStart: disableStart,
      disableStop: disableStop,
      disableRestart: disableRestart,
      isFlapping: isFlapping,
      errorText: errorText
    });
    
    const refreshEl = document.getElementById(`refresh-${serverKey}`);
    // 使用Nunjucks渲染刷新倒计时圆环
    refreshEl.innerHTML = nunjucks.renderString(tplCountdown, {
      interval: proc.sync_interval || 5
    });
      
  }


  /**
   * 单进程操作命令
   * @param {string} btn       操作按钮
   * @param {string} serverKey ${server.ip}:${server.port}
   * @param {string} action    命令 start restart stop
   * @param {string} proc      进程名
   */
  function doAction(btn, serverKey, action, proc) {
    /* 控制单个进程的 启动、停止、重启 */
    if (btn) btn.disabled = true; // 🔒 点击瞬间禁用，防连点
    sendCommand(serverKey, action, proc);
  }


  /**
   * 所有进程操作命令
   * @param {string} serverKey ${server.ip}:${server.port}
   * @param {string} action    命令 start restart stop
   */
  function doActionAll(serverKey, action) {
      /* 节点刷新蒙版 */
      const cardList = document.getElementById(`card-${serverKey}`);
      if (!cardList || cardList.classList.contains('loading')) return;
      cardList.classList.add('loading'); // 加类，显示蒙版
      setTimeout(() => cardList.classList.remove('loading'), 1000); // 1秒后移除类，蒙版消失
      sendCommandAll(serverKey, action);
  }


  /**
   * 抖动进程确认处理操作按钮
   * @param {string} serverKey ${server.ip}:${server.port}
   * @param {string} proc      进程名
   * @param {string} btnEl     当前按钮
   */
  function doAck(serverKey, proc, btnEl) {
    if (!confirm('确认已处理该问题？警告将立即清除。\n（若进程再次重启达到阈值，会重新标记）')) return;
    btnEl.disabled = true;
    btnEl.textContent = '处理中...';
    acknowledgeFlap(serverKey, proc).then(result => {
      if (!result.success) {
        alert('确认失败: ' + (result.error || '未知错误'));
        btnEl.disabled = false;
        btnEl.textContent = '✓ 确认已处理';
      }
      // 成功后后端会立即广播 full_sync，前端会自动刷新，不需要手动改 DOM
    });
  }


  /**
   * 重启 supervisor
   * @param {string} serverKey ${server.ip}:${server.port}
   */
  function restartSupervisor(serverKey) {
      const ws = serverData[serverKey]?.ws;
      
      if (!ws || ws.readyState !== WebSocket.OPEN) {
          alert('节点未连接，无法执行操作');
          return;
      }
      
      if (!confirm('⚠️ 危险操作！\n\n重启Supervisor会导致该节点所有被管理进程短暂中断，Supervisor重启后会自动拉起进程。\n\n是否确认继续？')) {
          return;
      }
      
      //点击按钮重启supervisor时
      isRestart = true;
      
      /* 节点刷新蒙版 */
      const cardList = document.getElementById(`card-${serverKey}`);
      if (!cardList || cardList.classList.contains('loading')) return;
      cardList.classList.add('loading'); // 加类，显示蒙版
      
      console.log('提取 wsUrl:');
      console.log(ws.url);//ws://192.168.1.121:8765/
      
      // 用 JS 内置的 URL 解析器，拆出 ip 和 port‌
      const u = new URL(ws.url);
      const s = {
        ip: u.hostname, // "192.168.1.121"
        port: u.port,   // "8765" 注意这里是字符串
        nodename: serverData[serverKey].nodename,   // 节点名称
      };
      
      console.log(s); // {ip: '192.168.1.121', port: '8765', nodename:'美国'}
      
      const btn = document.getElementById(`btn-restart-sv-${serverKey}`);
      btn.disabled = true;
      ori_btnText = btn.textContent; // 按钮原始名称
      btn.textContent = '重启中...';
      const req_id = ++reqIdCounter;
      ws.send(JSON.stringify({
          type: 'restart_supervisor',
          req_id: req_id
      }));
      
      // 5秒后恢复按钮状态（Supervisor重启需要时间）
      setTimeout(() => {
          btn.disabled = false;
          btn.textContent = ori_btnText; // 改回原名
          connectToServer(s); // 更新当前服务器列表
          cardList.classList.remove('loading');
          isRestart = false;// 重启之后，修改全局变量，不影响其它原因断连时的UI界面
          
      }, 5000);
      
  }


  /**
   * 手动刷新单个节点（包括重新加载配置）
   * @param {string} serverKey ${server.ip}:${server.port}
   */
  function refreshNode(serverKey) {
      /* 节点刷新蒙版 */
      const cardList = document.getElementById(`card-${serverKey}`);
      if (!cardList || cardList.classList.contains('loading')) return;
      cardList.classList.add('loading'); // 加类，显示蒙版
      setTimeout(() => cardList.classList.remove('loading'), 200); // 0.2秒后移除类，蒙版消失
      
      /* 点击刷新按钮 */
      const btn = document.getElementById(`btn-refresh-${serverKey}`);
      ori_btnText = btn.textContent;
      
      if (!btn || btn.disabled) return;
      const ws = serverData[serverKey]?.ws;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
          alert('节点未连接，无法刷新');
          return;
      }
      btn.disabled = true;
      const reqId = ++reqIdCounter;
      // 发刷新指令给对应节点
      ws.send(JSON.stringify({
          type: 'refresh',
          req_id: reqId
      }));
      // 0.2秒超时恢复按钮
      setTimeout(() => {
          btn.disabled = false;
      }, 200);
  }


  /**
   * 更新单节点进程运行情况，运行数，停止数等
   * @param {string} serverKey ${server.ip}:${server.port}
   */
  function updateServerStats(serverKey) {
    let total = 0, running = 0, dead = 0, error = 0, flapping = 0;
    
    const totalEl = document.getElementById(`total-${serverKey}`);
    const runEl   = document.getElementById(`run-${serverKey}`);
    const stopEl  = document.getElementById(`stop-${serverKey}`);
    const errEl   = document.getElementById(`err-${serverKey}`);
    const flapEl  = document.getElementById(`flap-${serverKey}`);
    
    const procs = Object.values((serverData[serverKey] && serverData[serverKey].processes) || {});
    
    console.log("当前节点："+serverKey);
    console.log(procs);
    
    //如果有节点进程数据
    if (procs) {
      total    = procs.filter(p => p.statename).length;
      running  = procs.filter(p => !p.flapping && p.statename === 'RUNNING').length;
      dead     = procs.filter(p => !p.flapping && ['STOPPED', 'EXITED'].includes(p.statename)).length;
      error    = procs.filter(p => !p.flapping && ['FATAL', 'BACKOFF'].includes(p.statename)).length;
      flapping = procs.filter(p => p.flapping).length;
    }
    
    if (totalEl) totalEl.textContent = total;
    if (runEl)   runEl.textContent   = running;
    if (stopEl)  stopEl.textContent  = dead;
    if (errEl)   errEl.textContent   = error;
    if (flapEl)  flapEl.textContent  = flapping;
  }


  /**
   * 更新全局节点进程总运行情况，总运行数，总停止数等
   */
  function updateGlobalStats() {
    let online = 0, offline = 0, total = 0, running = 0, dead = 0, error = 0, flapping = 0;
    
    Object.values(serverData).forEach(s => {
      if (s.connected) online++;
      if (!s.connected) offline++;
      
      Object.values(s.processes).forEach(p => {
        if (!p) return;
        if (s.connected) total++;       // 进程总数照常统计（含 flapping）
        
        // 👇 只要带抖动标记，就只进 flapping
        if (p.flapping) {
          if (s.connected) flapping++;
          return;                      // 相当于 forEach 里的 continue
        }
        
        // 下面只有"非 flapping"的进程才会走到这一层
        if (p.statename === 'RUNNING' && s.connected) running++;
        if (['STOPPED', 'EXITED'].includes(p.statename) && s.connected) dead++;
        if (['FATAL', 'BACKOFF'].includes(p.statename) && s.connected) error++;
      });
    });
    
    document.getElementById('stat-total-nodes').textContent = servers.length;
    document.getElementById('stat-online-nodes').textContent = online;
    document.getElementById('stat-offline-nodes').textContent = offline;
    document.getElementById('stat-total-procs').textContent = total;
    document.getElementById('stat-running-procs').textContent = running;
    document.getElementById('stat-dead-procs').textContent = dead;
    document.getElementById('stat-error-procs').textContent = error;
    document.getElementById('stat-flapping-procs').textContent = flapping;
    
    // 瀑布流新增：节点数据更新完成，触发重排
    window.dispatchEvent(new CustomEvent('nodesUpdated'));
    
    // 筛选功能：每次更新后自动应用筛选
    applyFilter();
  }

  /**  ========== 背景主题样式 结束 ========== **/


  /**
   * ========== 排序开关 开始 ========== 
   */
  const sortBtn = document.getElementById('sortToggleBtn');

  let sortEnabled = localStorage.getItem('sortEnabled') === 'true';

          //label.textContent = '⇅ 默认排序';
      }
  }
  
  // 初始化按钮状态
  updateSortBtn();

  // 点击切换
  sortBtn.addEventListener('click', () => {
      sortEnabled = !sortEnabled;
      localStorage.setItem('sortEnabled', sortEnabled);
      updateSortBtn();
  });
  /** ========== 排序开关 结束 ========== **/


  /**
   * ========== 瀑布流样式 ========== 
   */
  const layoutBtn = document.getElementById('masonryToggleBtn');
  // 真实容器是class="server-grid"，之前写错id导致逻辑全没执行！
  const gridContainer = document.querySelector('.server-grid');
  // 页面加载时读本地存储，默认网格模式
  let masonryEnabled = localStorage.getItem('masonryEnabled') === 'true';

  function layoutMasonry() {
      if (!masonryEnabled || !gridContainer) return;
      const cards = Array.from(gridContainer.querySelectorAll('.server-card'));
      if (cards.length === 0) return;
      
      // 1. 列数计算和原Grid 100%对齐：最小卡片宽420px，能放几列放几列，不硬编码
      const MIN_CARD_WIDTH = 420;
      const gap = 20;
      const containerStyles = getComputedStyle(gridContainer);
      const containerWidth = gridContainer.clientWidth 
        - parseFloat(containerStyles.paddingLeft) 
        - parseFloat(containerStyles.paddingRight);
      // 和原grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)) 计算逻辑完全一致
      const colCount = Math.max(1, Math.floor((containerWidth + gap) / (MIN_CARD_WIDTH + gap)));

      // 2. 计算每列宽度，和原Grid卡片宽度完全一致
      const colWidth = (containerWidth - gap * (colCount - 1)) / colCount;
      const colHeights = new Array(colCount).fill(0); // 记录每列当前总高度

      // 3. 先清掉卡片之前的定位，等DOM渲染完再算实际高度
      cards.forEach(card => {
          card.style.position = '';
          card.style.top = '';
          card.style.left = '';
          card.style.width = '';
      });
      
      // 强制浏览器重排，拿到真实卡片高度
      gridContainer.offsetHeight;

      // 4. 关键！第一行强制横向填满：前colCount个卡片依次放第1/2/3...列，保证第一行不空缺
      cards.forEach((card, idx) => {
          card.style.width = `${colWidth}px`;
          const cardHeight = card.offsetHeight;
          let colIndex;

          if (idx < colCount) {
              // 第一行强制按顺序放：第0个→列0，第1个→列1，第2个→列2，保证横向填满，不优先塞某一列
              colIndex = idx;
          } else {
              // 后面的卡片：找当前最矮的列放，保证各列高度均衡
              colIndex = colHeights.indexOf(Math.min(...colHeights));
          }

          // 计算位置
          const left = colIndex * (colWidth + gap);
          const top = colHeights[colIndex];
          card.style.position = 'absolute';
          card.style.left = `${left}px`;
          card.style.top = `${top}px`;

          // 更新列高度
          colHeights[colIndex] += cardHeight + gap;
      });

      // 5. 设置容器总高度，撑开页面不被截断
      gridContainer.style.height = `${Math.max(...colHeights)}px`;
  }
  
  function resetGridLayout() {
      // 切回网格模式：清掉所有绝对定位，恢复原grid
      if (!gridContainer) return;
      const cards = Array.from(gridContainer.querySelectorAll('.server-card'));
      cards.forEach(card => {
          card.style.position = '';
          card.style.top = '';
          card.style.left = '';
          card.style.width = '';
      });
      gridContainer.style.height = '';
  }
  
  // 防抖重排，监听容器本身宽度变化（拖窗口/Ctrl+滚轮缩放/任何宽度变化都会触发，不只是 window.resize）
  let resizeTimer;
  if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
              if (masonryEnabled) layoutMasonry();
          }, 100);
      });
      ro.observe(gridContainer);
  }
  // 兼容老浏览器兜底
  window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
          if (masonryEnabled) layoutMasonry();
      }, 200);
  });

  function updateLayoutBtn() {
      if (masonryEnabled) {
          gridContainer.classList.add('masonry'); // 加类，瀑布流生效
          layoutBtn.textContent = '🌊 瀑布流';
          // 等DOM渲染完再计算，避免高度取0
          setTimeout(layoutMasonry, 50);
      } else {
          gridContainer.classList.remove('masonry'); // 删类，恢复原网格
          layoutBtn.textContent = '📐 对齐网格';
          resetGridLayout();
      }
  }
  // 初始化布局状态
  updateLayoutBtn();

  // 点击切换
  layoutBtn.addEventListener('click', () => {
      masonryEnabled = !masonryEnabled;
      localStorage.setItem('masonryEnabled', masonryEnabled);
      updateLayoutBtn();
  });

  // 节点加载完/刷新后自动重排（给原有刷新逻辑调用）
  window.addEventListener('nodesUpdated', () => {
      if (masonryEnabled) setTimeout(layoutMasonry, 50);
  });
  /** ===== 瀑布流新增 结束 ===== **/


  /** ========== 全局状态筛选逻辑 ========== */
  let currentFilter = null;

  function applyFilter() {
    const grid = document.getElementById('dashboard');
    if (!grid) return;
    const cards = grid.querySelectorAll('.server-card');
    cards.forEach(card => {
      //const serverKey = card.id.replace('card-', '');
      const serverKey = card.dataset.node;
      const procList = document.getElementById(`procs-${serverKey}`);
      
      if (!procList) return;
      const isConnected = serverData[serverKey] && serverData[serverKey].connected;
      //const hasErrorTip = procList.querySelector('.error-tip') !== null;
      const procs = procList.querySelectorAll('.proc-item');
      let showCard = false;

      if (!currentFilter) {
        // 无筛选：全部显示，所有进程显示
        showCard = true;
        procs.forEach(p => p.style.display = '');
      }
      // 节点级筛选
      else if (currentFilter === 'ALL_NODES') {
        showCard = true; // 总节点：所有节点都显示
        procs.forEach(p => p.style.display = '');
      }
      else if (currentFilter === 'ONLINE_NODES') {
        showCard = isConnected; // 在线节点：只显示连接成功的
        procs.forEach(p => p.style.display = isConnected ? '' : 'none');
      }
      else if (currentFilter === 'OFFLINE_NODE') {
        showCard = !isConnected; // 失败节点：只显示连接失败的
        procs.forEach(p => p.style.display = 'none');
      }
      else if (currentFilter === 'ALL_PROCS') {
        showCard = isConnected; // 总进程：显示所有在线节点，所有进程显示
        procs.forEach(p => p.style.display = isConnected ? '' : 'none');
      }
      // 进程状态级筛选
      else {
        let visibleProcCount = 0;
        if (!isConnected) {
          // 连接失败的节点在进程筛选时不显示
          showCard = false;
        } else {
          procs.forEach(procEl => {
            let isMatch = false;
            if (currentFilter === 'FLAPPING') {
              isMatch = procEl.classList.contains('flapping');
            } else if (currentFilter === 'STOPPED') {
              isMatch = (procEl.classList.contains('proc-STOPPED') || procEl.classList.contains('proc-EXITED')) && !procEl.classList.contains('flapping');
            } else if (currentFilter === 'FATAL') {
              isMatch = procEl.classList.contains('proc-FATAL') || procEl.classList.contains('proc-BACKOFF');
            } else if (currentFilter === 'RUNNING') {
              isMatch = procEl.classList.contains('proc-RUNNING');
            }
            procEl.style.display = isMatch ? '' : 'none';
            if (isMatch) visibleProcCount++;
          });
          showCard = visibleProcCount > 0;
        }
      }
      card.style.display = showCard ? '' : 'none';
    });
    /* 瀑布流重排（如果开启）*/
    if (typeof masonryEnabled !== 'undefined' && masonryEnabled && typeof layoutMasonry === 'function') {
      setTimeout(layoutMasonry, 20);
    }
  }

  // DOM加载完后给筛选按钮绑定事件
  function initFilter() {
    document.querySelectorAll('.stat-filter').forEach(btn => {
      btn.style.cursor = 'pointer';
      btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;
        // 点同一个按钮取消筛选
        currentFilter = (currentFilter === filter) ? null : filter;
        // 更新按钮激活状态
        document.querySelectorAll('.stat-filter').forEach(b => {
          b.classList.toggle('active', b.dataset.filter === currentFilter);
        });
        // 执行筛选
        applyFilter();
      });
    });
  }


  // 页面加载完，执行
  document.addEventListener('DOMContentLoaded', () => {
      
      // 页面加载完更新节点列表
      initDashboard();
      
      // 初始化筛选按钮
      initFilter();
      
      /**
       ** 单节点详情页面样式 
       */
      if (singleNode){
        // 修改单节点详情页标题
        const baseTitle = document.title; // 只在开头存一次
        const serverCardEl = document.querySelector('.server-card');
        document.title = serverCardEl.dataset.nodename + " - " + baseTitle;
        
        //设置节点卡片的样式，原有样式是自动列数，这里需要其宽度最大化
        const dashboardList = document.getElementById('dashboard');
        dashboardList.style.cssText = `
            grid-template-columns: none;
        `;
        
        // 单节点详情页，不需要全局数据条
        const overviewList = document.querySelector('.overview');
        overviewList.style.cssText = `
            display: none;
        `;
        
        // 单节点详情页，不需要瀑布流按钮
        const masonryList = document.getElementById('masonryToggleBtn');
        masonryList.style.cssText = `
            display: none;
        `;
        
        // 1. 精准选中顶部.page-header下的h1，不会选到页面其他h1
        const pageTitle = document.querySelector('.page-header h1');
        if (!pageTitle) return; // 找不到元素直接退出，不报错
        
        const basePageUrl = window.location.origin + window.location.pathname;
        // 2. 替换h1里的内容为返回链接
        pageTitle.innerHTML = `
            <a href="${basePageUrl}" target="_self" class="back-link">
                ← 返回监控总览
            </a>
        `;
        
      }
  });
  
</script>
