<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MediaMTX WebRTC</title>
<style>
:root{
  --bg:#0b1220; --panel:#131c2e; --panel2:#0f1728; --border:#22304a;
  --text:#e6edf7; --muted:#8ea2be; --accent:#3b82f6;
  --green:#22c55e; --orange:#f97316; --red:#ef4444; --purple:#a855f7;
}
body.light{
  --bg:#eef2f7; --panel:#ffffff; --panel2:#f6f8fb; --border:#d8e0ea;
  --text:#132033; --muted:#5b6b82;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .25s,color .25s}
.app{max-width:1400px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--border)}
.status .led{width:9px;height:9px;border-radius:50%;background:#94a3b8}
.status.online .led{background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.status.error .led{background:var(--red)}
.status.connecting .led{background:#eab308}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:8px 14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:14px}
.controls label{color:var(--muted);font-size:13px}
.controls input{font:inherit;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 10px}
#serverInput{width:270px}#pathInput{width:160px}
.grid{display:grid;grid-template-columns:minmax(0,2.05fr) minmax(0,1fr);gap:14px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}
.video-wrap{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;}
video{width:100%;height:100%;display:block;object-fit:contain;}
.overlay{position:absolute;right:10px;top:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#4ade80;
  background:rgba(0,0,0,.5);padding:5px 8px;border-radius:7px;pointer-events:none}
.chart-wrap{height:220px;background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-top:14px;padding:10px}
canvas{width:100%;height:100%;display:block}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
.card .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.card .v{font:700 22px/1.1 ui-monospace,Menlo,Consolas,monospace}
.c-green{color:var(--green)}.c-blue{color:var(--accent)}.c-orange{color:var(--orange)}
.c-purple{color:var(--purple)}.c-red{color:var(--red)}
.rows{font-size:13px}
.rows .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
.rows .row:last-child{border-bottom:0}
.rows .row span:first-child{color:var(--muted)}
.rows .row span:last-child{font-family:ui-monospace,Menlo,Consolas,monospace;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h3{font-size:13px;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.4px}
#logBox{height:150px;overflow:auto;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px;
  font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
#logBox .e{color:var(--red)}#logBox .w{color:#eab308}#logBox .ok{color:var(--green)}#logBox .i{color:var(--muted)}
.tip{font-size:12px;color:var(--muted);margin-left:auto}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span> MediaMTX WebRTC</div>
    <div class="spacer"></div>
    <div id="status" class="status"><span class="led"></span><span id="statusText">未连接</span></div>
    <button id="themeBtn">夜间模式</button>
  </header>

  <div class="controls">
    <label>服务器</label>
    <input id="serverInput" value="http://192.168.1.121:8889" placeholder="http://192.168.1.121:8889" />
    <label>路径</label>
    <input id="pathInput" value="rtmp-webrtc" placeholder="rtmp-webrtc" />
    <button id="connectBtn" class="primary">连接</button>
    <button id="disconnectBtn">断开</button>
    <span id="whepShow" class="tip"></span>
  </div>

  <div class="grid">
    <div>
      <div class="video-wrap">
        <video id="video" autoplay muted playsinline controls></video>
        <div id="overlay" class="overlay">--</div>
      </div>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
      </div>
    </div>

    <div>
      <div class="cards">
        <div class="card"><div class="k">实时分辨率</div><div class="v c-blue" id="mRes">--</div></div>
        <div class="card"><div class="k">渲染帧率</div><div class="v c-purple" id="mFps">--</div></div>
        <div class="card"><div class="k">视频码率(Mbps)</div><div class="v c-green" id="mBitrate">--</div></div>
        <div class="card"><div class="k">丢包率</div><div class="v c-orange" id="mLoss">--</div></div>
      </div>

      <div class="panel" style="margin-bottom:14px">
        <h3>实时指标（WebRTC 底层数据）</h3>
        <div class="rows">
          <div class="row"><span>视频编码</span><span id="dCodec">--</span></div>
          <div class="row"><span>音频码率</span><span id="dAudio">--</span></div>
          <div class="row"><span>网络抖动 Jitter</span><span id="dJitter">--</span></div>
          <div class="row"><span>往返延迟 RTT</span><span id="dRtt">--</span></div>
          <div class="row"><span>已收包 / 丢包</span><span id="dPkt">--</span></div>
          <div class="row"><span>累计接收</span><span id="dRecv">--</span></div>
          <div class="row"><span>解码帧 / 丢弃帧</span><span id="dFrames">--</span></div>
          <div class="row"><span>关键帧请求 PLI / NACK</span><span id="dPli">--</span></div>
          <div class="row"><span>连接状态</span><span id="dConn">--</span></div>
        </div>
      </div>

      <div class="panel">
        <h3>系统日志</h3>
        <div id="logBox"></div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

/**
 * @callback OnError
 * @param {string} err - error.
 */

/**
 * @callback OnTrack
 * @param {RTCTrackEvent} evt - track event.
 */

/**
 * @callback OnDataChannel
 * @param {RTCDataChannelEvent} evt - data channel event.
 */

/**
 * @typedef Conf
 * @type {object}
 * @property {string} url - absolute URL of the WHEP endpoint.
 * @property {string} user - username.
 * @property {string} pass - password.
 * @property {string} token - token.
 * @property {OnError} onError - called when there's an error.
 * @property {OnTrack} onTrack - called when there's a track available.
 * @property {OnDataChannel} onDataChannel - called when there's a data channel available.
 */

/** WebRTC/WHEP reader. */
class MediaMTXWebRTCReader {
  static #RETRY_PAUSE = 2000;

  #conf;
  #state = "getting_codecs";
  #restartTimeout = null;
  #pc = null;
  #offerData = null;
  #sessionUrl = null;
  #queuedCandidates = [];
  #nonAdvertisedCodecs;

  /**
   * Create a MediaMTXWebRTCReader.
   * @param {Conf} conf - configuration.
   */
  constructor(conf) {
    this.#conf = conf;
    this.#getNonAdvertisedCodecs();
  }

  /**
   * Close the reader and all its resources.
   */
  close() {
    this.#state = "closed";

    if (this.#pc !== null) {
      this.#pc.close();
    }

    if (this.#restartTimeout !== null) {
      clearTimeout(this.#restartTimeout);
    }
  }

  static #supportsNonAdvertisedCodec(codec, fmtp) {
    return new Promise((resolve) => {
      const pc = new RTCPeerConnection({ iceServers: [] });
      const mediaType = "audio";
      let payloadType = "";

      pc.addTransceiver(mediaType, { direction: "recvonly" });
      pc.createOffer()
        .then((offer) => {
          if (offer.sdp === undefined) {
            throw new Error("SDP not present");
          }
          if (offer.sdp.includes(` ${codec}`)) {
            // codec is advertised, there's no need to add it manually
            throw new Error("already present");
          }

          const sections = offer.sdp.split(`m=${mediaType}`);

          const payloadTypes = sections
            .slice(1)
            .map((s) => s.split("\r\n")[0].split(" ").slice(3))
            .reduce((prev, cur) => [...prev, ...cur], []);
          payloadType = this.#reservePayloadType(payloadTypes);

          const lines = sections[1].split("\r\n");
          lines[0] += ` ${payloadType}`;
          lines.splice(lines.length - 1, 0, `a=rtpmap:${payloadType} ${codec}`);
          if (fmtp !== undefined) {
            lines.splice(lines.length - 1, 0, `a=fmtp:${payloadType} ${fmtp}`);
          }
          sections[1] = lines.join("\r\n");
          offer.sdp = sections.join(`m=${mediaType}`);
          return pc.setLocalDescription(offer);
        })
        .then(() =>
          pc.setRemoteDescription(
            new RTCSessionDescription({
              type: "answer",
              sdp:
                "v=0\r\n" +
                "o=- 6539324223450680508 0 IN IP4 0.0.0.0\r\n" +
                "s=-\r\n" +
                "t=0 0\r\n" +
                "a=fingerprint:sha-256 0D:9F:78:15:42:B5:4B:E6:E2:94:3E:5B:37:78:E1:4B:54:59:A3:36:3A:E5:05:EB:27:EE:8F:D2:2D:41:29:25\r\n" +
                `m=${mediaType} 9 UDP/TLS/RTP/SAVPF ${payloadType}\r\n` +
                "c=IN IP4 0.0.0.0\r\n" +
                "a=ice-pwd:7c3bf4770007e7432ee4ea4d697db675\r\n" +
                "a=ice-ufrag:29e036dc\r\n" +
                "a=sendonly\r\n" +
                "a=rtcp-mux\r\n" +
                `a=rtpmap:${payloadType} ${codec}\r\n` +
                (fmtp !== undefined ? `a=fmtp:${payloadType} ${fmtp}\r\n` : ""),
            }),
          ),
        )
        .then(() => {
          resolve(true);
        })
        .catch(() => {
          resolve(false);
        })
        .finally(() => {
          pc.close();
        });
    });
  }

  static #unquoteCredential(v) {
    return JSON.parse(`"${v}"`);
  }

  static #linkToIceServers(links) {
    return links !== null
      ? links.split(", ").map((link) => {
          const m = link.match(
            /^<(.+?)>; rel="ice-server"(; username="(.*?)"; credential="(.*?)"; credential-type="password")?/i,
          );
          const ret = {
            urls: [m[1]],
          };

          if (m[3] !== undefined) {
            ret.username = this.#unquoteCredential(m[3]);
            ret.credential = this.#unquoteCredential(m[4]);
            ret.credentialType = "password";
          }

          return ret;
        })
      : [];
  }

  static #parseOffer(sdp) {
    const ret = {
      iceUfrag: "",
      icePwd: "",
      medias: [],
    };

    for (const line of sdp.split("\r\n")) {
      if (line.startsWith("m=")) {
        ret.medias.push(line.slice("m=".length));
      } else if (ret.iceUfrag === "" && line.startsWith("a=ice-ufrag:")) {
        ret.iceUfrag = line.slice("a=ice-ufrag:".length);
      } else if (ret.icePwd === "" && line.startsWith("a=ice-pwd:")) {
        ret.icePwd = line.slice("a=ice-pwd:".length);
      }
    }

    return ret;
  }

  static #reservePayloadType(payloadTypes) {
    // everything is valid between 30 and 127, except for interval between 64 and 95
    // https://chromium.googlesource.com/external/webrtc/+/refs/heads/master/call/payload_type.h#29
    for (let i = 30; i <= 127; i++) {
      if ((i <= 63 || i >= 96) && !payloadTypes.includes(i.toString())) {
        const pl = i.toString();
        payloadTypes.push(pl);
        return pl;
      }
    }
    throw Error("unable to find a free payload type");
  }

  static #enableStereoPcmau(payloadTypes, section) {
    const lines = section.split("\r\n");

    let payloadType = this.#reservePayloadType(payloadTypes);
    lines[0] += ` ${payloadType}`;
    lines.splice(lines.length - 1, 0, `a=rtpmap:${payloadType} PCMU/8000/2`);
    lines.splice(lines.length - 1, 0, `a=rtcp-fb:${payloadType} transport-cc`);

    payloadType = this.#reservePayloadType(payloadTypes);
    lines[0] += ` ${payloadType}`;
    lines.splice(lines.length - 1, 0, `a=rtpmap:${payloadType} PCMA/8000/2`);
    lines.splice(lines.length - 1, 0, `a=rtcp-fb:${payloadType} transport-cc`);

    return lines.join("\r\n");
  }

  static #enableMultichannelOpus(payloadTypes, section) {
    const lines = section.split("\r\n");

    let payloadType = this.#reservePayloadType(payloadTypes);
    lines[0] += ` ${payloadType}`;
    lines.splice(
      lines.length - 1,
      0,
      `a=rtpmap:${payloadType} multiopus/48000/3`,
    );
    lines.splice(
      lines.length - 1,
      0,
      `a=fmtp:${payloadType} channel_mapping=0,2,1;num_streams=2;coupled_streams=1`,
    );
    lines.splice(lines.length - 1, 0, `a=rtcp-fb:${payloadType} transport-cc`);

    payloadType = this.#reservePayloadType(payloadTypes);
    lines[0] += ` ${payloadType}`;
    lines.splice(
      lines.length - 1,
      0,
      `a=rtpmap:${payloadType} multiopus/48000/4`,
    );
    lines.splice(
      lines.length - 1,
      0,
      `a=fmtp:${payloadType} channel_mapping=0,1,2,3;num_streams=2;coupled_streams=2`,
    );
    lines.splice(lines.length - 1, 0, `a=rtcp-fb:${payloadType} transport-cc`);

    payloadType = this.#reservePayloadType(payloadTypes);
    lines[0] += ` ${payloadType}`;
    lines.splice(
      lines.length - 1,
      0,
      `a=rtpmap:${payloadType} multiopus/48000/5`,
    );
    lines.splice(
      lines.length - 1,
      0,
      `a=fmtp:${payloadType} channel_mapping=0,4,1,2,3;num_streams=3;coupled_streams=2`,
    );
    lines.splice(lines.length - 1, 0, `a=rtcp-fb:${payloadType} transport-cc`);

    payloadType = this.#reservePayloadType(payloadTypes);
    lines[0] += ` ${payloadType}`;
    lines.splice(
      lines.length - 1,
      0,
      `a=rtpmap:${payloadType} multiopus/48000/6`,
    );
    lines.splice(
      lines.length - 1,
      0,
      `a=fmtp:${payloadType} channel_mapping=0,4,1,2,3,5;num_streams=4;coupled_streams=2`,
    );
    lines.splice(lines.length - 1, 0, `a=rtcp-fb:${payloadType} transport-cc`);

    payloadType = this.#reservePayloadType(payloadTypes);
    lines[0] += ` ${payloadType}`;
    lines.splice(
      lines.length - 1,
      0,
      `a=rtpmap:${payloadType} multiopus/48000/7`,
    );
    lines.splice(
      lines.length - 1,
      0,
      `a=fmtp:${payloadType} channel_mapping=0,4,1,2,3,5,6;num_streams=4;coupled_streams=4`,
    );
    lines.splice(lines.length - 1, 0, `a=rtcp-fb:${payloadType} transport-cc`);

    payloadType = this.#reservePayloadType(payloadTypes);
    lines[0] += ` ${payloadType}`;
    lines.splice(
      lines.length - 1,
      0,
      `a=rtpmap:${payloadType} multiopus/48000/8`,
    );
    lines.splice(
      lines.length - 1,
      0,
      `a=fmtp:${payloadType} channel_mapping=0,6,1,4,5,2,3,7;num_streams=5;coupled_streams=4`,
    );
    lines.splice(lines.length - 1, 0, `a=rtcp-fb:${payloadType} transport-cc`);

    return lines.join("\r\n");
  }

  static #enableL16(payloadTypes, section) {
    const lines = section.split("\r\n");

    let payloadType = this.#reservePayloadType(payloadTypes);
    lines[0] += ` ${payloadType}`;
    lines.splice(lines.length - 1, 0, `a=rtpmap:${payloadType} L16/8000/2`);
    lines.splice(lines.length - 1, 0, `a=rtcp-fb:${payloadType} transport-cc`);

    payloadType = this.#reservePayloadType(payloadTypes);
    lines[0] += ` ${payloadType}`;
    lines.splice(lines.length - 1, 0, `a=rtpmap:${payloadType} L16/16000/2`);
    lines.splice(lines.length - 1, 0, `a=rtcp-fb:${payloadType} transport-cc`);

    payloadType = this.#reservePayloadType(payloadTypes);
    lines[0] += ` ${payloadType}`;
    lines.splice(lines.length - 1, 0, `a=rtpmap:${payloadType} L16/48000/2`);
    lines.splice(lines.length - 1, 0, `a=rtcp-fb:${payloadType} transport-cc`);

    return lines.join("\r\n");
  }

  static #enableStereoOpus(section) {
    let opusPayloadFormat = "";
    const lines = section.split("\r\n");

    for (let i = 0; i < lines.length; i++) {
      if (
        lines[i].startsWith("a=rtpmap:") &&
        lines[i].toLowerCase().includes("opus/")
      ) {
        opusPayloadFormat = lines[i].slice("a=rtpmap:".length).split(" ")[0];
        break;
      }
    }

    if (opusPayloadFormat === "") {
      return section;
    }

    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startsWith(`a=fmtp:${opusPayloadFormat} `)) {
        if (!lines[i].includes("stereo")) {
          lines[i] += ";stereo=1";
        }
        if (!lines[i].includes("sprop-stereo")) {
          lines[i] += ";sprop-stereo=1";
        }
      }
    }

    return lines.join("\r\n");
  }

  static #editOffer(sdp, nonAdvertisedCodecs) {
    const sections = sdp.split("m=");

    const payloadTypes = sections
      .slice(1)
      .map((s) => s.split("\r\n")[0].split(" ").slice(3))
      .reduce((prev, cur) => [...prev, ...cur], []);

    for (let i = 1; i < sections.length; i++) {
      if (sections[i].startsWith("audio")) {
        sections[i] = this.#enableStereoOpus(sections[i]);

        if (nonAdvertisedCodecs.includes("pcma/8000/2")) {
          sections[i] = this.#enableStereoPcmau(payloadTypes, sections[i]);
        }
        if (nonAdvertisedCodecs.includes("multiopus/48000/6")) {
          sections[i] = this.#enableMultichannelOpus(payloadTypes, sections[i]);
        }
        if (nonAdvertisedCodecs.includes("L16/48000/2")) {
          sections[i] = this.#enableL16(payloadTypes, sections[i]);
        }

        break;
      }
    }

    return sections.join("m=");
  }

  static #generateSdpFragment(od, candidates) {
    const candidatesByMedia = {};
    for (const candidate of candidates) {
      const mid = candidate.sdpMLineIndex;
      if (candidatesByMedia[mid] === undefined) {
        candidatesByMedia[mid] = [];
      }
      candidatesByMedia[mid].push(candidate);
    }

    let frag = `a=ice-ufrag:${od.iceUfrag}\r\n` + `a=ice-pwd:${od.icePwd}\r\n`;

    let mid = 0;

    for (const media of od.medias) {
      if (candidatesByMedia[mid] !== undefined) {
        frag += `m=${media}\r\n` + `a=mid:${mid}\r\n`;

        for (const candidate of candidatesByMedia[mid]) {
          frag += `a=${candidate.candidate}\r\n`;
        }
      }
      mid++;
    }

    return frag;
  }

  /** @param {string} err */
  #handleError(err) {
    if (this.#state === "running") {
      if (this.#pc !== null) {
        this.#pc.close();
        this.#pc = null;
      }

      this.#offerData = null;

      if (this.#sessionUrl !== null) {
        fetch(this.#sessionUrl, {
          method: "DELETE",
        });
        this.#sessionUrl = null;
      }

      this.#queuedCandidates = [];
      this.#state = "restarting";

      this.#restartTimeout = window.setTimeout(
        () => this.#restart(),
        MediaMTXWebRTCReader.#RETRY_PAUSE,
      );

      if (this.#conf.onError !== undefined) {
        this.#conf.onError(`${err}, retrying in some seconds`);
      }
    } else if (this.#state === "getting_codecs") {
      this.#state = "failed";

      if (this.#conf.onError !== undefined) {
        this.#conf.onError(err);
      }
    }
  }

  #restart() {
    this.#restartTimeout = null;
    this.#state = "running";
    this.#start();
  }

  #getNonAdvertisedCodecs() {
    Promise.all(
      [
        ["pcma/8000/2"],
        [
          "multiopus/48000/6",
          "channel_mapping=0,4,1,2,3,5;num_streams=4;coupled_streams=2",
        ],
        ["L16/48000/2"],
      ].map((c) =>
        MediaMTXWebRTCReader.#supportsNonAdvertisedCodec(c[0], c[1]).then(
          (r) => (r ? c[0] : false),
        ),
      ),
    )
      .then((c) => c.filter((e) => e !== false))
      .then((codecs) => {
        if (this.#state !== "getting_codecs") {
          throw new Error("closed");
        }

        this.#nonAdvertisedCodecs = codecs;
        this.#state = "running";
        this.#start();
      })
      .catch((err) => {
        this.#handleError(err.toString());
      });
  }

  #start() {
    this.#requestICEServers()
      .then((iceServers) => this.#setupPeerConnection(iceServers))
      .then((offer) => this.#sendOffer(offer))
      .then((answer) => this.#setAnswer(answer))
      .catch((err) => {
        this.#handleError(err.toString());
      });
  }

  #authHeader() {
    if (this.#conf.user !== undefined && this.#conf.user !== "") {
      const credentials = btoa(`${this.#conf.user}:${this.#conf.pass}`);
      return { Authorization: `Basic ${credentials}` };
    }
    if (this.#conf.token !== undefined && this.#conf.token !== "") {
      return { Authorization: `Bearer ${this.#conf.token}` };
    }
    return {};
  }

  #requestICEServers() {
    return fetch(this.#conf.url, {
      method: "OPTIONS",
      headers: this.#authHeader(),
    }).then((res) =>
      MediaMTXWebRTCReader.#linkToIceServers(res.headers.get("Link")),
    );
  }

  #setupPeerConnection(iceServers) {
    if (this.#state !== "running") {
      throw new Error("closed");
    }

    this.#pc = new RTCPeerConnection({
      iceServers,
      // https://webrtc.org/getting-started/unified-plan-transition-guide
      sdpSemantics: "unified-plan",
    });

    const direction = "recvonly";
    this.#pc.addTransceiver("video", { direction });
    this.#pc.addTransceiver("audio", { direction });

    // using data channels requires creating a data channel locally
    this.#pc.createDataChannel("");

    this.#pc.onicecandidate = (evt) => this.#onLocalCandidate(evt);
    this.#pc.onconnectionstatechange = () => this.#onConnectionState();
    this.#pc.ontrack = (evt) => this.#onTrack(evt);
    this.#pc.ondatachannel = (evt) => this.#onDataChannel(evt);

    return this.#pc.createOffer().then((offer) => {
      offer.sdp = MediaMTXWebRTCReader.#editOffer(
        offer.sdp,
        this.#nonAdvertisedCodecs,
      );
      this.#offerData = MediaMTXWebRTCReader.#parseOffer(offer.sdp);

      return this.#pc.setLocalDescription(offer).then(() => offer.sdp);
    });
  }

  #sendOffer(offer) {
    if (this.#state !== "running") {
      throw new Error("closed");
    }

    return fetch(this.#conf.url, {
      method: "POST",
      headers: {
        ...this.#authHeader(),
        "Content-Type": "application/sdp",
      },
      body: offer,
    }).then((res) => {
      switch (res.status) {
        case 201:
          break;
        case 404:
          throw new Error("stream not found");
        case 400:
          return res.json().then((e) => {
            throw new Error(e.error);
          });
        default:
          throw new Error(`bad status code ${res.status}`);
      }

      this.#sessionUrl = new URL(
        res.headers.get("location"),
        this.#conf.url,
      ).toString();

      return res.text();
    });
  }

  #setAnswer(answer) {
    if (this.#state !== "running") {
      throw new Error("closed");
    }

    return this.#pc
      .setRemoteDescription(
        new RTCSessionDescription({
          type: "answer",
          sdp: answer,
        }),
      )
      .then(() => {
        if (this.#state !== "running") {
          return;
        }

        if (this.#queuedCandidates.length !== 0) {
          this.#sendLocalCandidates(this.#queuedCandidates);
          this.#queuedCandidates = [];
        }
      });
  }

  #onLocalCandidate(evt) {
    if (this.#state !== "running") {
      return;
    }

    if (evt.candidate !== null) {
      if (this.#sessionUrl === null) {
        this.#queuedCandidates.push(evt.candidate);
      } else {
        this.#sendLocalCandidates([evt.candidate]);
      }
    }
  }

  #sendLocalCandidates(candidates) {
    fetch(this.#sessionUrl, {
      method: "PATCH",
      headers: {
        "Content-Type": "application/trickle-ice-sdpfrag",
        "If-Match": "*",
      },
      body: MediaMTXWebRTCReader.#generateSdpFragment(
        this.#offerData,
        candidates,
      ),
    })
      .then((res) => {
        switch (res.status) {
          case 204:
            break;
          case 404:
            throw new Error("stream not found");
          default:
            throw new Error(`bad status code ${res.status}`);
        }
      })
      .catch((err) => {
        this.#handleError(err.toString());
      });
  }

  #onConnectionState() {
    if (this.#state !== "running") {
      return;
    }

    // "closed" can arrive before "failed" and without
    // the close() method being called at all.
    // It happens when the other peer sends a termination
    // message like a DTLS CloseNotify.
    if (
      this.#pc.connectionState === "failed" ||
      this.#pc.connectionState === "closed"
    ) {
      this.#handleError("peer connection closed");
    }
  }

  #onTrack(evt) {
    if (this.#conf.onTrack !== undefined) {
      this.#conf.onTrack(evt);
    }
  }

  #onDataChannel(evt) {
    if (this.#conf.onDataChannel !== undefined) {
      this.#conf.onDataChannel(evt);
    }
  }

  /**
   * Return the WebRTC statistics report of the underlying peer connection.
   * @returns {Promise<RTCStatsReport|null>}
   */
  getStats() {
    if (this.#pc === null) {
      return Promise.resolve(null);
    }
    return this.#pc.getStats();
  }

  /**
   * Return the current state of the underlying peer connection.
   * @returns {string}
   */
  getConnectionState() {
    return this.#pc !== null ? this.#pc.connectionState : "new";
  }

}

window.MediaMTXWebRTCReader = MediaMTXWebRTCReader;

</script>

<!-- 以下才是本页面逻辑实现代码 -->
<script>
"use strict";

//这是一个简化的 DOM 选择器函数。
//它封装了原生的 document.querySelector 方法，
//允许通过 $('.class') 或 $('#id') 的方式快速选取页面中的第一个匹配元素。
const $ = (s) => document.querySelector(s);

//元素列表
const el = {
  video: $("#video"), overlay: $("#overlay"),
  status: $("#status"), statusText: $("#statusText"),
  server: $("#serverInput"), path: $("#pathInput"),
  whepShow: $("#whepShow"),
  connect: $("#connectBtn"), disconnect: $("#disconnectBtn"),
  chart: $("#chart"), logBox: $("#logBox"),
  themeBtn: $("#themeBtn"),
};

//创建一个 URLSearchParams 实例。
//location.search 包含当前 URL 的查询字符串部分（即 ? 后面的内容）。URLSearchParams 提供了便捷的方法来读取、设置和删除这些参数。
const qp = new URLSearchParams(location.search);

//配置对象 CFG
const CFG = {
  server: qp.get("server") || el.server.value,// 优先从 URL 参数 ?server=xxx 获取，若无则从元素中取值
  path: qp.get("path") || el.path.value,
  interval: 1000,
  points: 60,
};

el.server.value = CFG.server; //webrtc 服务器
el.path.value = CFG.path;     //webrtc 路径

let reader = null, pollTimer = null, rafTimer = null, started = false;
let prev = { bytes: 0, audio: 0, ts: 0 };
let series = { mbps: [], fps: [] };
let renderFps = 0, lastFrameTs = 0;

/* ---------- 日志 ---------- */
function log(msg, cls) {
  const t = new Date().toLocaleTimeString();
  const d = document.createElement("div");
  d.className = cls || "i";
  d.textContent = "[" + t + "] " + msg;
  el.logBox.prepend(d);
  while (el.logBox.childElementCount > 120) el.logBox.lastChild.remove();
}

/* ---------- 状态 ---------- */
function setStatus(kind, text) {
  el.status.className = "status " + kind;
  el.statusText.textContent = text;
}

/* ---------- 主题 ---------- */
let dark = true;
el.themeBtn.addEventListener("click", () => {
  dark = !dark;
  document.body.classList.toggle("light", !dark);
  el.themeBtn.textContent = dark ? "夜间模式" : "日间模式";
  drawChart();
});

/* ---------- WHEP 地址 ---------- */
function whepUrl() {
  const base = el.server.value.trim().replace(/\/+$/, "");
  const p = el.path.value.trim().replace(/^\/+|\/+$/g, "");
  return base + "/" + p + "/whep";
}
function refreshWhepShow() { el.whepShow.textContent = "WHEP: " + whepUrl(); }
el.server.addEventListener("input", refreshWhepShow);
el.path.addEventListener("input", refreshWhepShow);
refreshWhepShow();

/* ---------- 连接 / 断开 ---------- */
function connect() {
  disconnect();
  setStatus("connecting", "连接中");
  const url = whepUrl();
  log("开始连接 " + url);
  series = { mbps: [], fps: [] };
  prev = { bytes: 0, audio: 0, ts: 0 };
  renderFps = 0; lastFrameTs = 0; started = false;

  reader = new MediaMTXWebRTCReader({
    url: url,
    onError: (err) => {
      log("错误: " + err, "e");
      setStatus("error", "错误");
    },
    onTrack: (evt) => {
      el.video.srcObject = evt.streams[0];
      el.video.play().catch(() => {});
      setStatus("online", "已连接");
      if (!started) {
        started = true;
        log("已收到媒体轨道，开始拉流", "ok");
        startPolling();
        startRenderFps();
      }
    },
    onDataChannel: () => log("收到数据通道"),
  });
}

function disconnect() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (rafTimer) { cancelAnimationFrame(rafTimer); rafTimer = null; }
  if (reader) { try { reader.close(); } catch (e) {} reader = null; }
  if (el.video.srcObject) el.video.srcObject = null;
  started = false;
  setStatus("", "未连接");
}

el.connect.addEventListener("click", connect);
el.disconnect.addEventListener("click", disconnect);
window.addEventListener("beforeunload", () => { if (reader) reader.close(); });

/* ---------- 渲染帧率（requestVideoFrameCallback） ---------- */
function startRenderFps() {
  if (!el.video.requestVideoFrameCallback) return;
  const step = (now) => {
    if (lastFrameTs) {
      const dt = now - lastFrameTs;
      if (dt > 0) {
        const inst = 1000 / dt;
        renderFps = renderFps ? renderFps * 0.85 + inst * 0.15 : inst;
      }
    }
    lastFrameTs = now;
    rafTimer = el.video.requestVideoFrameCallback(step);
  };
  lastFrameTs = 0;
  rafTimer = el.video.requestVideoFrameCallback(step);
}

/* ---------- 数据轮询 ---------- */
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollStats, CFG.interval);
  pollStats();
}

async function pollStats() {
  if (!reader || !reader.getStats) return;
  let report;
  try { report = await reader.getStats(); } catch (e) { return; }
  if (!report) return;

  let v = null, a = null, pair = null, codec = "";
  report.forEach((r) => {
    if (r.type === "inbound-rtp") {
      const kind = r.kind || r.mediaType;
      if (kind === "video") v = r;
      else if (kind === "audio") a = r;
    } else if (r.type === "candidate-pair" && r.state === "succeeded" && (r.nominated || r.selected)) {
      pair = r;
    }
  });
  if (v && v.codecId) { const c = report.get(v.codecId); if (c) codec = c.mimeType || ""; }

  const now = performance.now();
  let mbps = 0, aKbps = 0;
  if (v && prev.ts) {
    const dt = (now - prev.ts) / 1000;
    if (dt > 0) mbps = ((v.bytesReceived - prev.bytes) * 8) / dt / 1e6;
  }
  if (a && prev.ts) {
    const dt = (now - prev.ts) / 1000;
    if (dt > 0) aKbps = ((a.bytesReceived - prev.audio) * 8) / dt / 1e3;
  }
  if (v) prev.bytes = v.bytesReceived;
  if (a) prev.audio = a.bytesReceived;
  prev.ts = now;

  const w = v && v.frameWidth, h = v && v.frameHeight;
  const fps = (v && v.framesPerSecond) ? v.framesPerSecond : renderFps;
  const lost = v ? (v.packetsLost || 0) : 0;
  const recv = v ? (v.packetsReceived || 0) : 0;
  const lossRate = (lost + recv) > 0 ? (lost / (lost + recv)) * 100 : 0;
  const jitterMs = (v && v.jitter != null) ? v.jitter * 1000 : 0;
  const rttMs = (pair && pair.currentRoundTripTime != null) ? pair.currentRoundTripTime * 1000 : null;
  const decoded = v ? (v.framesDecoded || 0) : 0;
  const dropped = v ? (v.framesDropped || 0) : 0;
  const pli = v ? (v.pliCount || 0) : 0;
  const nack = v ? (v.nackCount || 0) : 0;

  $("#mRes").textContent = w ? (w + "x" + h) : "--";
  $("#mFps").textContent = fps ? Number(fps).toFixed(1) : "--";
  $("#mBitrate").textContent = mbps ? mbps.toFixed(2) : "--";
  $("#mLoss").textContent = (lost + recv) > 0 ? (lossRate.toFixed(2) + "%") : "--";
  $("#mLoss").className = "v " + (lossRate > 2 ? "c-red" : "c-orange");

  $("#dCodec").textContent = codec || "--";
  $("#dAudio").textContent = aKbps ? (aKbps.toFixed(1) + " Kbps") : "--";
  $("#dJitter").textContent = v ? (jitterMs.toFixed(1) + " ms") : "--";
  $("#dRtt").textContent = (rttMs != null) ? (rttMs.toFixed(1) + " ms") : "--";
  $("#dPkt").textContent = v ? (recv + " / " + lost) : "--";
  $("#dRecv").textContent = v ? ((v.bytesReceived / 1048576).toFixed(2) + " MB") : "--";
  $("#dFrames").textContent = v ? (decoded + " / " + dropped) : "--";
  $("#dPli").textContent = v ? (pli + " / " + nack) : "--";
  $("#dConn").textContent = reader.getConnectionState ? reader.getConnectionState() : "--";

  el.overlay.textContent = w
    ? ("LIVE " + w + "x" + h + " @ " + (fps ? Number(fps).toFixed(0) : 0) + "fps  " + mbps.toFixed(2) + "Mbps")
    : "--";

  series.mbps.push(mbps);
  series.fps.push(Number(fps) || 0);
  if (series.mbps.length > CFG.points) { series.mbps.shift(); series.fps.shift(); }
  drawChart();
}

/* ---------- 手绘曲线 ---------- */
function cssv(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }

function drawChart() {
  const c = el.chart;
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth || 600, h = c.clientHeight || 200;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const pad = { l: 48, r: 48, t: 18, b: 16 };
  const W = w - pad.l - pad.r, H = h - pad.t - pad.b;
  const border = cssv("--border"), muted = cssv("--muted");

  ctx.strokeStyle = border; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (H * i) / 4;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + W, y); ctx.stroke();
  }

  const maxM = Math.max(1, ...series.mbps, 0);
  const maxF = Math.max(10, ...series.fps, 0);

  ctx.fillStyle = muted; ctx.font = "11px ui-monospace, monospace"; ctx.textBaseline = "middle";
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (H * i) / 4;
    ctx.textAlign = "right"; ctx.fillText((maxM * (1 - i / 4)).toFixed(1), pad.l - 6, y);
    ctx.textAlign = "left";  ctx.fillText(String(Math.round(maxF * (1 - i / 4))), pad.l + W + 6, y);
  }

  const line = (arr, max, color) => {
    if (arr.length < 2) return;
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
    arr.forEach((val, i) => {
      const x = pad.l + (W * i) / (CFG.points - 1);
      const y = pad.t + H - (Math.min(val, max) / max) * H;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    });
    ctx.stroke();
  };
  line(series.mbps, maxM, "#22c55e");
  line(series.fps, maxF, "#3b82f6");

  ctx.font = "11px system-ui, sans-serif"; ctx.textBaseline = "top";
  ctx.fillStyle = "#22c55e"; ctx.fillRect(pad.l, 2, 10, 4);
  ctx.fillStyle = muted; ctx.textAlign = "left"; ctx.fillText("视频码率 Mbps", pad.l + 16, 0);
  ctx.fillStyle = "#3b82f6"; ctx.fillRect(pad.l + 150, 2, 10, 4);
  ctx.fillStyle = muted; ctx.fillText("帧率 fps", pad.l + 166, 0);
}

window.addEventListener("resize", () => drawChart());
drawChart();

/* 自动连接 */
log("页面就绪，WHEP 地址: " + whepUrl());
connect();
</script>
