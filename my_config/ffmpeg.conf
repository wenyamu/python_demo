#ffmpeg.conf 内容开始

[program:4-mediamtx]
; priority=10
user = root
directory = /python/supervisor_ffmpeg

command = /root/diy/mediamtx /root/diy/mediamtx.yml

autostart = false
autorestart = true
startsecs = 1
startretries = 3
stopasgroup = true
killasgroup = true
environment=TZ="Asia/Shanghai",MTX_LOGLEVEL="error"

stdout_logfile = /python/logs/mediamtx_out.log
stderr_logfile = /python/logs/mediamtx_err.log

dependent_startup=true

[program:5-push_mediamtx]
; priority=11
user = root
directory = /python/supervisor_ffmpeg

#command = python3 push_mediamtx.py -i /dev/video0 -s rtmp://192.168.1.121:1935/show-rtc/abc123456 --run
command = python3 push_mediamtx.py -i /python/supervisor_ffmpeg/live/mp4 -s rtmp://192.168.1.121:1935/show-rtc/abc123456 --run

autostart = false
autorestart = true
startsecs = 1
startretries = 3
stopasgroup = true
killasgroup = true
environment=TZ="Asia/Shanghai"

stdout_logfile = /python/logs/push_mediamtx_out.log
stderr_logfile = /python/logs/push_mediamtx_err.log

dependent_startup=true
dependent_startup_wait_for=4-mediamtx:running

[program:6-ffmpeg_douyin]
; priority=12
user = root
directory = /python/supervisor_ffmpeg

command = python3 /python/ts_log.py ffmpeg -hide_banner -loglevel error -y -i rtmp://192.168.1.121:1935/show-rtc/abc123456 -c:v copy -c:a copy -f flv rtmp://39.96.29.167:1935/show/abc123456

autostart = false
autorestart = true
startsecs = 1
startretries = 3
stopasgroup = true
killasgroup = true
environment=TZ="Asia/Shanghai",TS_FMT="%%Y-%%m-%%d %%H:%%M:%%S.%%3f"

stdout_logfile = /python/logs/ffmpeg_douyin_out.log
stderr_logfile = /python/logs/ffmpeg_douyin_err.log

dependent_startup=true
dependent_startup_wait_for=5-push_mediamtx:running

[program:7-ffmpeg_kuaishou]
; priority=13
user = root
directory = /python/supervisor_ffmpeg

command = python3 /python/ts_log.py ffmpeg -hide_banner -loglevel error -y -i rtmp://192.168.1.121:1935/show-rtc/abc123456 -c:v copy -c:a copy -f flv rtmp://39.96.29.167:1935/show-flv/abc123456

autostart = false
autorestart = true
startsecs = 1
startretries = 3
stopasgroup = true
killasgroup = true
environment=TZ="Asia/Shanghai",TS_FMT="%%Y-%%m-%%d %%H:%%M:%%S.%%3f"

stdout_logfile = /python/logs/ffmpeg_kuaishou_out.log
stderr_logfile = /python/logs/ffmpeg_kuaishou_err.log

dependent_startup=true
dependent_startup_wait_for=5-push_mediamtx:running

[group:push]
programs=6-ffmpeg_douyin,7-ffmpeg_kuaishou

#ffmpeg.conf 内容结束
