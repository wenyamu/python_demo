#flask80.conf 内容开始 与 webapp443.conf 不同之处就是 gunicorn 引入的参数配置文件不同，还有程序名不同

[program:1-flask_app80]
user = root
directory = /python

#把gunicorn 的参数集中放入一个配置文件中(跟 nginx 启动一样，也是需要配置文件)
#flasktest:app, flasktest指的是flasktest.py, app指的是flasktest.py中的app=Flask(...)

command = python3 /python/ts_log.py /usr/local/bin/gunicorn -c /python/gconf80.py flasktest:app

autostart = true
autorestart = true
startsecs = 1
startretries = 3
stopasgroup = true
killasgroup = true
environment=TZ="Asia/Shanghai"

stdout_logfile = /python/logs/supervisor_80_out.log
stderr_logfile = /python/logs/supervisor_80_err.log

#flask80.conf 内容结束

