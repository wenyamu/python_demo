version: '3'
services:
  abc:
    # 镜像本地无则自动下载
    image: python:slim-bullseye
    hostname: supervisorHost
    # 映射端口 【宿主机端口:容器端口】
    ports:
      - "9527:9527" #ws端口
      - "9001:9001" #supervisor 监控端口
    # 目录挂载 【宿主机目录:容器目录】
    volumes:
      - /root/python:/python
    # 容器名称
    container_name: supervisortest
    restart: always
    # 相当于 docker run -i
    stdin_open: true
    # 相当于 docker run -t
    tty: true
