<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/monit.css') }}">
    <title>Supervisor 进程监控（RPC版）</title>
    <style>
    </style>
</head>
<body>
    <div class="page-header">
        <div class="left-group">
          <h1>🚀 分布式 Supervisor 进程监控（RPC版）</h1>
        </div>
        <div class="header-actions">
          <button id="sortToggleBtn" class="layout-toggle">
              <span id="sortBtnLabel">⇕ 默认排序</span>
              <span class="help-icon" data-tip="状态排序：抖动、异常、停止的程序置顶。">?</span>
          </button>
          <button id="masonryToggleBtn" class="layout-toggle">📐 对齐网格</button>
          <button class="layout-toggle" id="themeToggle">☀ 白天</button>
        </div>
    </div>

    <!-- ========== 顶部全局统计条 ========== -->
    <div class="overview">
    
    <div class="stat-item stat-filter" data-filter="ALL_NODES">
      <span class="stat-icon stat-value black">🖥️</span>
      <span class="stat-label">总节点</span>
      <span class="stat-value black" id="stat-total-nodes">0</span>
    </div>
    
    <div class="stat-item stat-filter" data-filter="ONLINE_NODES">
      <span class="stat-icon stat-value green">●</span>
      <span class="stat-label">在线节点</span>
      <span class="stat-value green" id="stat-online-nodes">0</span>
    </div>
    
    <div class="stat-item stat-filter" data-filter="OFFLINE_NODE">
      <span class="stat-icon stat-value red">✖</span>
      <span class="stat-label">离线节点</span>
      <span class="stat-value red" id="stat-offline-nodes">0</span>
    </div>
    
    <div class="stat-item stat-filter" data-filter="ALL_PROCS">
      <span class="stat-icon stat-value blue">⚙</span>
      <span class="stat-label">进程总数</span>
      <span class="stat-value blue" id="stat-total-procs">0</span>
    </div>
    
    <div class="stat-item stat-filter" data-filter="RUNNING">
      <span class="stat-icon stat-value green">►</span>
      <span class="stat-label">运行中</span>
      <span class="stat-value green" id="stat-running-procs">0</span>
    </div>
    <div class="stat-item stat-filter" data-filter="STOPPED">
      <span class="stat-icon stat-value gray">■</span>
      <span class="stat-label">已终止</span>
      <span class="stat-value gray" id="stat-dead-procs">0</span>
    </div>
    <div class="stat-item stat-filter" data-filter="FATAL">
      <span class="stat-icon stat-value red">✖</span>
      <span class="stat-label">启动失败</span>
      <span class="stat-value red" id="stat-error-procs">0</span>
    </div>
    <div class="stat-item stat-filter" data-filter="FLAPPING">
      <span class="stat-icon stat-value orange">⚡</span>
      <span class="stat-label">抖动进程</span>
      <span class="stat-value orange" id="stat-flapping-procs">0</span>
    </div>
    
  </div>
    
    <div class="server-container" id="dashboard">
    {% if sn and sdict.get(sn) %}
      {% set info = sdict.get(sn) %}
      <div class="server-block" data-server="{{ sn }}" data-nodename="{{info.nodename}}">
          {% include '_node.html' %}
      </div>
    {% else %}
        {% for sn, info in sdict.items() %}
        <div class="server-block" data-server="{{ sn }}" data-nodename="{{info.nodename}}">
            {% include '_node.html' %}
        </div>
        {% endfor %}
    {% endif %}
    </div>

    <!-- 操作提示 -->
    <div class="toast" id="toast"></div>

<script>
    
    /**
     ** 单节点详情页面配置
     */
    let singleNode = false;
    
    // js 获取当前浏览器参数 ?node=192.168.1.121:8000
    const p = new URLSearchParams(location.search);
    const node = p.get('node');
    console.log("url参数：");
    console.log(node);
    
    if(node){
      singleNode = true;
      localStorage.setItem('masonryEnabled', false);//单节点详情页面模式，禁用瀑布流样式
    }
    /**单节点详情页面配置 结束*/
    
    
    // 自动刷新间隔，默认10秒
    const REFRESH_INTERVAL = 10000;
    
    // 记录用户正在交互/悬停/滚动的节点，自动刷新时跳过
    const ACTIVE_NODES = new Set();
    
    // ========== 刷新用的节点级锁：防止手动刷新 / 自动刷新互相叠加 ==========
    const REFRESHING = new Set();
    
    // ========== 主题切换（初始化已经在head最顶部执行，这里只绑定按钮） ==========
    // ✅ 修复闪黑：页面最顶部执行主题初始化，渲染前就设置主题
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    // 首屏禁用过渡，避免闪烁
    document.documentElement.classList.add('no-transitions');
    
    const toggleBtn = document.getElementById('themeToggle');
    function updateThemeBtn(theme) {
        toggleBtn.textContent = theme === 'dark' ? '🌙 夜晚' : '☀️ 白天';
    }
    updateThemeBtn(savedTheme);
    toggleBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeBtn(next);
    });

    // 首帧渲染完恢复过渡效果
    window.requestAnimationFrame(() => {
        setTimeout(() => document.documentElement.classList.remove('no-transitions'), 100);
    });


    // ========== 统计单节点数据 ==========
    function countServerStats(server) {
        const procs = server.querySelectorAll('.process-item');
        let total = 0, running = 0, stopped = 0, error = 0, flapping = 0;
        
        procs.forEach(p => {
            total++;
            
            if (p.classList.contains('RUNNING') || p.classList.contains('running') ||
                p.classList.contains('STARTING') || p.classList.contains('STOPPING')) {
                running++;
            } else if (p.classList.contains('STOPPED') || p.classList.contains('EXITED') ||
                       p.classList.contains('stopped') || p.classList.contains('exited')) {
                stopped++;
            } else if (p.classList.contains('FATAL') || p.classList.contains('BACKOFF') ||
                       p.classList.contains('fatal') || p.classList.contains('backoff')) {
                error++;
            } else if (p.classList.contains('FLAPPING') || p.classList.contains('flapping')) {
                flapping++;
            }
        });
        
        return { total, running, stopped, error, flapping };
    }


    // ========== 更新所有统计（全局+单节点） ==========
    function updateAllStats() {
        const servers = document.querySelectorAll('.server-block');
        let totalNodes = servers.length;
        let onlineNodes = 0;
        let offlineNodes = 0;
        let gTotal = 0, gRunning = 0, gStopped = 0, gError = 0, gFlapping = 0;
        
        //设置倒计时圆环动画时长
        setRingAnimation(REFRESH_INTERVAL);
        
        servers.forEach(server => {
            
            const hasError = server.querySelector('.error-tip');
            if (!hasError) onlineNodes++;
            if (hasError) offlineNodes++;
            
            const stats = countServerStats(server);
            gTotal    += stats.total;
            gRunning  += stats.running;
            gStopped  += stats.stopped;
            gError    += stats.error;
            gFlapping += stats.flapping;
            
            // 更新单节点统计数字
            const sn = server.dataset.server;
            const statEl = document.getElementById('node-stats-' + sn);
            if (statEl) {
                statEl.querySelector('.node-total').textContent    = stats.total;
                statEl.querySelector('.node-running').textContent  = stats.running;
                statEl.querySelector('.node-stopped').textContent  = stats.stopped;
                statEl.querySelector('.node-error').textContent    = stats.error;
                statEl.querySelector('.node-flapping').textContent = stats.flapping;
                
            }
        });

        // 更新全局统计
        document.getElementById('stat-total-nodes').textContent    = totalNodes;
        document.getElementById('stat-online-nodes').textContent   = onlineNodes;
        document.getElementById('stat-offline-nodes').textContent   = offlineNodes;
        document.getElementById('stat-total-procs').textContent    = gTotal;
        document.getElementById('stat-running-procs').textContent  = gRunning;
        document.getElementById('stat-dead-procs').textContent     = gStopped;
        document.getElementById('stat-error-procs').textContent    = gError;
        document.getElementById('stat-flapping-procs').textContent = gFlapping;
        
        // 单节点详情页面不侦听节点交互
        if(!singleNode){
          rebindHover();
        }
        
        // 筛选功能：每次更新后自动应用筛选
        applyFilter();
        
        /**
         ** 单节点详情页面样式 
         */
        if (singleNode){
            
            // 修改单节点详情页标题
            const baseTitle = document.title; // 只在开头存一次
            const serverBlockEl = document.querySelector('.server-block');
            document.title = serverBlockEl.dataset.nodename + " - " + baseTitle;
            
            //设置节点卡片的样式，原有样式是自动列数，这里需要其宽度最大化
            const dashboardList = document.querySelector('.server-container');
            dashboardList.style.cssText = `
                grid-template-columns: none;
            `;
            
            // 单节点详情页，显示节点全局操作命令，全部启动、全部停止等按钮
            const actionsList = document.querySelector('.server-actions');
            actionsList.style.cssText = `
                display: "";
            `;
            
            /*设置进程列表新样式，使其符合单节点详情页的要求*/
            const procList = document.querySelector('.process-list');
            procList.style.cssText = `
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
                gap: 0 10px;
                align-items: start;
                max-height: 550px;
            `;
            
            // 单节点详情页，不需要全局数据条
            const overviewList = document.querySelector('.overview');
            overviewList.style.cssText = `
                display: none;
            `;
            
            // 单节点详情页，不需要瀑布流按钮
            const masonryList = document.getElementById('masonryToggleBtn');
            masonryList.style.cssText = `
                display: none;
            `;
            
            /* 修改单节点详情页，返回监控总览按钮*/
            const pageTitle = document.querySelector('.left-group');
            if (!pageTitle) return; // 找不到元素直接退出，不报错
            pageTitle.innerHTML = `
                <a href="{{ url_for('index') }}" class="back-link">← 返回监控总览</a>
                
            `;
            
        }
      
    }


    // 只取"当前单节点"的 HTML
    async function fetchNodeHtml(sn) {
        const res = await fetch(`/api/node/${encodeURIComponent(sn)}`, { cache: 'no-cache' });
        if (res.ok) {
            return await res.text();
        } else {
            throw new Error('HTTP ' + res.status);
        }
    }


    // === 仅刷新单个节点（silent=true 静默自动刷新；false 手动刷新带蒙版） ===
    async function refreshSingleServer(serverEl, silent = false) {
        
        const sn = serverEl.dataset.server;
        const refreshBtn = serverEl.querySelector('.btn-refresh-node');
        
        // 静默自动刷新：用户正在这个节点上悬停/滚动，直接跳过
        if (silent && ACTIVE_NODES.has(sn)) {
            return;
        }
        // 同一节点已有刷新在跑 → 跳过本次，杜绝请求叠加
        if (REFRESHING.has(sn)) {
            return;
        }
        REFRESHING.add(sn);

        // ========== 刷新前：只记节点内部状态 ==========
        // 1. 记录每个分组的折叠状态（true=折叠，false=展开）
        const foldStates = [];
        serverEl.querySelectorAll('[onclick*="toggleGroup"]').forEach(h => {
            const container = h.nextElementSibling;
            foldStates.push(container ? container.classList.contains('hidden') : null);
        });
        // 2. 记录滚动位置（serverEl 自身 + 内部所有元素，按顺序存）
        const scrollStates = [serverEl.scrollTop];
        
        serverEl.querySelectorAll('*').forEach(el => {
            scrollStates.push(el.scrollTop);
        });
        
        // 手动刷新才显示蒙版+按钮转圈，自动静默刷新时不显示
        if (!silent) {
            if (refreshBtn) refreshBtn.classList.add('loading');
            serverEl.classList.add('loading');
        }

        try {
            const html = await fetchNodeHtml(sn);   // 单节点html

            // 双帧原子更新，浏览器看不到中间态
            requestAnimationFrame(() => {
                serverEl.innerHTML = html;

                // 恢复折叠状态
                serverEl.querySelectorAll('[onclick*="toggleGroup"]').forEach((h, i) => {
                    const container = h.nextElementSibling;
                    const foldIcon = h.querySelector('.fold-icon');
                    if (!container || foldStates[i] === null || foldStates[i] === undefined) return;
                    if (foldStates[i]) {
                        container.classList.add('hidden');
                        if (foldIcon) foldIcon.classList.add('collapsed');
                    } else {
                        container.classList.remove('hidden');
                        if (foldIcon) foldIcon.classList.remove('collapsed');
                    }
                });

                // 第二帧恢复节点内部滚动条
                requestAnimationFrame(() => {
                    
                    serverEl.scrollTop = scrollStates[0];
                    const newEls = serverEl.querySelectorAll('*');
                    newEls.forEach((el, i) => {
                        if (scrollStates[i + 1] !== undefined) {
                            el.scrollTop = scrollStates[i + 1];
                        }
                    });
                    
                    updateAllStats();
                    
                });
            });
            // 手动刷新才弹成功提示，自动静默不弹
            if (!silent) showToast('节点刷新成功', 'success');
        } catch (err) {
            console.error('刷新节点失败:', err);
            // 手动刷新才弹错误提示，自动静默只打控制台不打扰
            if (!silent) showToast('刷新失败，请检查连接', 'error');
        } finally {
            REFRESHING.delete(sn);
            if (!silent) {
                // 手动刷新才移除loading状态
                serverEl.classList.remove('loading');
                if (refreshBtn) refreshBtn.classList.remove('loading');
            }
            
        }
    }

    // === 自动刷新所有节点（★ 并发进行：一个节点连不上，不再拖住其他节点） ===
    async function autoRefreshAll() {
        
        const allServers = Array.from(document.querySelectorAll('.server-block'));
        await Promise.allSettled(
            allServers
                .filter(serverEl => !serverEl.classList.contains('loading'))
                .map(serverEl => refreshSingleServer(serverEl, true))   // true=静默模式，无任何UI提示
        );
        
    }


    // 分组折叠
    function toggleGroup(headerBar) {
        const container = headerBar.nextElementSibling;
        const foldIcon = headerBar.querySelector('.fold-icon');
        container.classList.toggle('hidden');//加 hidden 表示折叠
        const collapsed = container.classList.contains('hidden');
        foldIcon.classList.toggle('collapsed', collapsed);
    }

    // ========== Toast提示 ==========
    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = `toast show ${type}`;
        setTimeout(() => toast.classList.remove('show'), 1000);
    }

    // ========== 全局AJAX拦截：所有操作都只刷新单节点，不整页刷新 ==========
    document.addEventListener('click', async (e) => {
        // 处理手动刷新按钮
        const refreshBtn = e.target.closest('.btn-refresh-node');
        if (refreshBtn && !refreshBtn.disabled && !refreshBtn.classList.contains('loading')) {
            e.preventDefault();
            const serverEl = refreshBtn.closest('.server-block');
            await refreshSingleServer(serverEl);
            return;
        }

        // 处理其他操作按钮（单进程/组/批量/重启Supervisor）
        const btn = e.target.closest('a.btn');
        if (!btn || btn.disabled || btn.classList.contains('loading')) return;
        
        e.preventDefault();
        
        const url = btn.getAttribute('href');
        const serverEl = btn.closest('.server-block');
        const isRestartSupervisor = btn.dataset.action === 'restart-supervisor';
        
        // 点击“重启Supervisor”按钮，弹出提示
        if (isRestartSupervisor){
          if (!confirm('⚠️ 危险操作！\n\n重启Supervisor会导致该节点所有被管理进程短暂中断，Supervisor重启后会自动拉起进程。\n\n是否确认继续？')) {
              return;
          }
        }
        
        serverEl.classList.add('loading');
        btn.classList.add('loading');
        btn.disabled = true;
        
        try {
            const res = await fetch(url, {
                method: 'GET',
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });

            if (res.ok) {
                showToast('操作执行成功', 'success');
                // 重启Supervisor延迟3秒，其他操作延迟1秒，移除蒙版
                const delay = isRestartSupervisor ? 3000 : 1000;
                setTimeout(() => refreshSingleServer(serverEl).then(() => {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }), delay);
            } else {
                showToast('操作失败: ' + res.status, 'error');
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        } catch (err) {
            showToast('网络错误，请检查连接', 'error');
            btn.classList.remove('loading');
            btn.disabled = false;
        }
    });


    /********* 排序开关切换（和主题切换逻辑完全相同） *********/
    const sortBtn = document.getElementById('sortToggleBtn');
    // 页面加载时读本地存储，恢复上次的状态
    let sortEnabled = localStorage.getItem('sortEnabled') === 'true';
    
    function updateSortBtn() {
        const label = document.getElementById('sortBtnLabel');
        if (sortEnabled) {
            document.documentElement.classList.add('sort-enabled');// 加类，排序生效
            label.textContent = '⇓ 状态排序';
            //label.textContent = '⇑ 状态排序';
        } else {
            document.documentElement.classList.remove('sort-enabled');// 删类，恢复默认顺序
            label.textContent = '⇕ 默认排序';
            //label.textContent = '⇅ 默认排序';
        }
    }
    
    // 初始化排序按钮状态
    updateSortBtn();
    
    // 点击排序按钮,切换排序类型
    sortBtn.addEventListener('click', () => {
        sortEnabled = !sortEnabled;
        localStorage.setItem('sortEnabled', sortEnabled);
        updateSortBtn();
    });


    /********* 倒计时圆环动画（仅动画，无js逻辑）*********/
    function setRingAnimation(countdownSeconds) {
        //添加属性，更改倒计时动画时长
        //const countdownEl = server.querySelector('.refresh-countdown');
        //countdownEl.style.setProperty('--duration', `${countdownSeconds}ms`);
        
        //遍历标签，添加属性，更改倒计时动画时长
        //<div class="refresh-countdown" style="--duration: 10000ms;"><div>
        document.querySelectorAll('.refresh-countdown').forEach(countdownEl => {
            countdownEl.style.setProperty('--duration', `${countdownSeconds}ms`);
            //countdownEl.style.setProperty('--duration', "0ms");//时长为0时，圆环充满
        })
    }
    
    
    /**
     * 判断元素是否出现了垂直滚动条
     * @param {HTMLElement} el 要检测的DOM元素
     * @returns {boolean} true=有垂直滚动条，false=没有
     */
    function hasVerticalScrollbar(el) {
      if (!el) return false;
      // 元素隐藏时clientHeight为0，检测不准直接返回false
      const style = window.getComputedStyle(el);
      if (style.display === 'none' || style.visibility === 'hidden') return false;
      //  overflow设置为hidden时，即使内容超出也不会显示滚动条
      if (style.overflowY === 'hidden' || style.overflowY === 'visible') return false;
      // 核心判断：内容总高度 > 可视高度 = 出现滚动条
      return el.scrollHeight > el.clientHeight + 1; // +1是为了兼容小数像素误差
    }

    
    function rebindHover() {
        // ========== 监听节点交互，用户正在操作/悬停/滚动时不自动刷新 ==========
        document.querySelectorAll('.server-block').forEach(serverEl => {
            let isVerticalScroll;
            const processEl = serverEl.querySelector('.process-list');
            
            const sn = serverEl.dataset.server;
            
            // 鼠标悬停在该节点上 = 正在看，跳过自动刷新
            serverEl.addEventListener('mouseenter', () => {
              
              console.log("鼠标进入："+sn);
              
              isVerticalScroll= hasVerticalScrollbar(processEl);//检测进程列表有没有垂直滚动条
              console.log("垂直滚动条："+isVerticalScroll);
              
              //有垂直滚动条，停止后台自动刷新
              if(isVerticalScroll){
                  ACTIVE_NODES.add(sn);
                  serverEl.classList.add('node-paused');     // 冻住圆环动画
              }
              
            });
            
            // 鼠标离开该节点上 = 恢复自动刷新
            serverEl.addEventListener('mouseleave', () => {
              ACTIVE_NODES.delete(sn);
              serverEl.classList.remove('node-paused');     // 恢复圆环动画
              console.log("鼠标离开："+sn);
            });
            /* 
            // 节点内部，正在滚动时禁用刷新，如果超过1秒不滚动则再次启动刷新
            let scrollTimer;
            serverEl.addEventListener('scroll', () => {
                ACTIVE_NODES.add(sn);
                serverEl.classList.add('node-paused');      // 冻住圆环动画
                console.log("鼠标滚动："+sn);
                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(() => {
                  ACTIVE_NODES.delete(sn);
                  serverEl.classList.remove('node-paused'); // 恢复圆环动画
                  console.log("鼠标停止滚动："+sn);
                }, 1000);
                console.log("-----："+sn);
            }, true);
            */
        });
    }
    
    
    /** ========== 全局状态筛选逻辑 ========== */
    function hideParentIfAllLiHidden() {
      /**
       ** 当进程组标签 '.group-card' 下面的 li 标签 全部有 style="display: none;"，则此进程组标签也给加上 style="display: none;" 使其也隐藏了。
      **/
      
      document.querySelectorAll('.group-card').forEach(div => {
        // 找到进程组标签 '.group-card'下所有直接/间接的li标签
        // 也就是进程标签 ".process-item"
        // <li class="process-item RUNNING" data-proc="flask:1-flask_app80" data-node="192.168.1.121:8000" data-statename="RUNNING" style="display: none;">
        const allLi = div.querySelectorAll('li');
        if (allLi.length === 0) return; // 没有li，不做处理
        
        // 判断：是不是所有li都被设置了 display:none
        const allLiHidden = Array.from(allLi).every(li => li.style.display === 'none');
        
        // 全部li都隐藏，就把父div也就是进程组隐藏；否则正常显示
        div.style.display = allLiHidden ? 'none' : '';
      });
    }


    let currentFilter = null;


    // 执行筛选
    function applyFilter() {
      const grid = document.getElementById('dashboard');
      if (!grid) return;
      const cards = grid.querySelectorAll('.server-block');
      cards.forEach(card => {
        const serverKey = card.dataset.server;
        const procList = card.querySelector(".process-list");
        
        if (!procList) return;
        const isConnected = !procList.querySelector('.error-tip');
        //const hasErrorTip = procList.querySelector('.error-tip') !== null;
        const procs = procList.querySelectorAll('.process-item');
        
        let showCard = false;

        if (!currentFilter) {
          // 无筛选：全部显示，所有进程显示
          showCard = true;
          procs.forEach(p => p.style.display = '');
          
        }
        // 节点级筛选
        else if (currentFilter === 'ALL_NODES') {
          showCard = true; // 总节点：所有节点都显示
          procs.forEach(p => p.style.display = '');
        }
        else if (currentFilter === 'ONLINE_NODES') {
          showCard = isConnected; // 在线节点：只显示连接成功的
          procs.forEach(p => p.style.display = isConnected ? '' : 'none');
        }
        else if (currentFilter === 'OFFLINE_NODE') {
          showCard = !isConnected; // 失败节点：只显示连接失败的
          procs.forEach(p => p.style.display = 'none');
        }
        else if (currentFilter === 'ALL_PROCS') {
          showCard = isConnected; // 总进程：显示所有在线节点，所有进程显示
          procs.forEach(p => p.style.display = isConnected ? '' : 'none');
        }
        // 进程状态级筛选
        else {
          let visibleProcCount = 0;
          if (!isConnected) {
            // 连接失败的节点在进程筛选时不显示
            showCard = false;
          } else {
            procs.forEach(procEl => {
              let isMatch = false;
              if (currentFilter === 'FLAPPING') {
                isMatch = procEl.classList.contains('flapping');
              } else if (currentFilter === 'STOPPED') {
                isMatch = (procEl.classList.contains('STOPPED') || procEl.classList.contains('EXITED')) && !procEl.classList.contains('flapping');
              } else if (currentFilter === 'FATAL') {
                isMatch = procEl.classList.contains('FATAL') || procEl.classList.contains('BACKOFF');
              } else if (currentFilter === 'RUNNING') {
                isMatch = procEl.classList.contains('RUNNING');
              }
              procEl.style.display = isMatch ? '' : 'none';
              
              if (isMatch) visibleProcCount++;
              
            });
            showCard = visibleProcCount > 0;
          }
        }
        card.style.display = showCard ? '' : 'none';
        
      });
      
      // 用于进程组，如果没有进程组，可以省略
      // 有时候进程组的进程都被过滤了，但是进程组标签还显示在那里
      // 此函数就是解决这个问题的
      hideParentIfAllLiHidden();
      
    }

    // 给筛选按钮绑定事件
    function initFilter() {
      document.querySelectorAll('.stat-filter').forEach(btn => {
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', () => {
          const filter = btn.dataset.filter;
          // 点同一个按钮取消筛选
          currentFilter = (currentFilter === filter) ? null : filter;
          // 更新按钮激活状态
          document.querySelectorAll('.stat-filter').forEach(b => {
            b.classList.toggle('active', b.dataset.filter === currentFilter);
          });
          // 执行筛选
          applyFilter();
        });
      });
    }


    // 页面加载完，执行更新所有统计，自动定时刷新等函数
    document.addEventListener('DOMContentLoaded', () => {
        // 页面加载完更新所有统计
        updateAllStats();
        
        // 单节点详情页面不侦听节点交互
        if(!singleNode){
          rebindHover();
        }
        
        // 初始化筛选按钮
        initFilter();
        
        
        // 页面加载完，自动定时刷新（★ 上一次彻底跑完才排下一次，杜绝请求堆积）
        async function autoLoop() {
            
            try {
                await autoRefreshAll();
            } catch (e) {
                console.warn('自动刷新异常:', e);
            } finally {
                setTimeout(autoLoop, REFRESH_INTERVAL);
            }
            
        }
        // 开启定时后台刷新
        setTimeout(autoLoop, REFRESH_INTERVAL);
        
    });

    // 点击“确认已处理”按钮，消除当前进程的历史数据，在后台消除
    document.addEventListener('click', async (e) => {
      const ackBtn = e.target.closest('.ack-btn-inline')
      if (!ackBtn) return
      
      // 定位按钮所在的那一块（当前进程）closest 是"从当前按钮往上找最近的祖先"
      const liEl = ackBtn.closest('.process-item')//这里就是找到li标签
      if (!liEl) return;
      
      // 发请求给后端，清除数据
      await fetch('/api/ack_flap', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          node: liEl.dataset.node, 
          proc_name: liEl.dataset.proc, 
          
        })
      })
      
      liEl.classList.remove('flapping') // 后端清成功了再删前端类，删除抖动标记
      
      statename = liEl.dataset.statename//此时的状态就是 STOPPED，因为是抖动被停止的
      liEl.classList.add(statename) // 把当前状态作为类名，填入 class
      
      // 激活当前进程的操作按钮
      // 在 liEl 内部找所有操作按钮，逐个去掉 disabled 类
      liEl.querySelectorAll('.process-ops a').forEach(a => {
          a.classList.remove('disabled');
      });
      
      ackBtn.remove() // 删“确认已处理”按钮
      
    })
    
    /* ==============================================
       ===== 瀑布流新增 开始：布局切换逻辑，和主题/排序逻辑风格一致 =====
       ============================================== */
    const layoutBtn = document.getElementById('masonryToggleBtn');
    const gridContainer = document.querySelector('.server-container');
    // 页面加载时读本地存储，默认网格模式
    let masonryEnabled = localStorage.getItem('masonryEnabled') === 'true';

    function updateLayoutBtn() {
        if (masonryEnabled) {
            gridContainer.classList.add('masonry'); // 加类，瀑布流生效
            layoutBtn.textContent = '🌊 瀑布流';
        } else {
            gridContainer.classList.remove('masonry'); // 删类，恢复原网格
            layoutBtn.textContent = '📐 对齐网格';
        }
    }
    // 初始化布局状态
    updateLayoutBtn();

    // 点击切换
    layoutBtn.addEventListener('click', () => {
        masonryEnabled = !masonryEnabled;
        localStorage.setItem('masonryEnabled', masonryEnabled);
        updateLayoutBtn();
    });
    /* ===== 瀑布流新增 结束 ===== */


</script>
</body>
</html>
