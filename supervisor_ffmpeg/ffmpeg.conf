#ffmpeg.conf 内容开始

#定义应用名称 mediamtx（一个配置文件中可以配置多个程序）
[program:mediamtx]
#标准推荐范围为 0-999 ‌默认值‌：‌999‌ ‌规则‌：‌数值越小，优先级越高，越先启动‌。
; priority=10
#创建该项目用户
user = root

#应用目录
directory = /python/supervisor_ffmpeg

#ffmpeg程序
command = /root/diy/mediamtx /root/diy/mediamtx.yml

autostart = false #在supervisord启动的时候，false 表示不自动启动，true 表示随着启动
autorestart = true #程序异常退出后，false 表示不自动重启，true 表示自动重启
startsecs = 3 #稳定运行N秒后，从“正在启动”转成“正在运行”状态，值为0表示无需保持运行特定时长。
startretries = 3 #进程启动失败后，最大尝试的次数。当超过3次后，supervisor将把此进程的状态置为FATAL
stopasgroup = true #确保关闭supervisord时停止所有相关子进程
killasgroup = true #确保关闭supervisord时停止所有相关子进程

#日志目录必须事先存在，不然会出错
stdout_logfile = /python/logs/mediamtx_out.log
stderr_logfile = /python/logs/mediamtx_err.log

dependent_startup=true

#定义应用名称 push_mediamtx（一个配置文件中可以配置多个程序）
[program:push_mediamtx]
#标准推荐范围为 0-999 ‌默认值‌：‌999‌ ‌规则‌：‌数值越小，优先级越高，越先启动‌。
; priority=11
#创建该项目用户
user = root

#应用目录
directory = /python/supervisor_ffmpeg

#ffmpeg程序
#command = python3 push_mediamtx.py -i /dev/video0 -s rtmp://192.168.1.121:1935/show-rtc/abc123456 --run
command = python3 push_mediamtx.py -i /python/supervisor_ffmpeg/live/mp4 -s rtmp://192.168.1.121:1935/show-rtc/abc123456 --run

autostart = false #在supervisord启动的时候，false 表示不自动启动，true 表示随着启动
autorestart = true #程序异常退出后，false 表示不自动重启，true 表示自动重启
startsecs = 3 #稳定运行N秒后，从“正在启动”转成“正在运行”状态，值为0表示无需保持运行特定时长。
startretries = 3 #进程启动失败后，最大尝试的次数。当超过3次后，supervisor将把此进程的状态置为FATAL
stopasgroup = true #确保关闭supervisord时停止所有相关子进程
killasgroup = true #确保关闭supervisord时停止所有相关子进程

#日志目录必须事先存在，不然会出错
stdout_logfile = /python/logs/push_mediamtx_out.log
stderr_logfile = /python/logs/push_mediamtx_err.log

dependent_startup=true
dependent_startup_wait_for=mediamtx:running

#定义应用名称 ffmpeg_douyin（一个配置文件中可以配置多个程序）
[program:ffmpeg_douyin]
#标准推荐范围为 0-999 ‌默认值‌：‌999‌ ‌规则‌：‌数值越小，优先级越高，越先启动‌。
; priority=12
#创建该项目用户
user = root

#应用目录
directory = /python/supervisor_ffmpeg

#ffmpeg程序
command = ffmpeg -hide_banner -loglevel error -y -i rtmp://192.168.1.121:1935/show-rtc/abc123456 -c:v copy -c:a copy -f flv rtmp://39.96.29.167:1935/show/abc123456

autostart = false #在supervisord启动的时候，false 表示不自动启动，true 表示随着启动
autorestart = true #程序异常退出后，false 表示不自动重启，true 表示自动重启
startsecs = 3 #稳定运行N秒后，从“正在启动”转成“正在运行”状态，值为0表示无需保持运行特定时长。
startretries = 3 #进程启动失败后，最大尝试的次数。当超过3次后，supervisor将把此进程的状态置为FATAL
stopasgroup = true #确保关闭supervisord时停止所有相关子进程
killasgroup = true #确保关闭supervisord时停止所有相关子进程

#日志目录必须事先存在，不然会出错
stdout_logfile = /python/logs/ffmpeg_douyin_out.log
stderr_logfile = /python/logs/ffmpeg_douyin_err.log

dependent_startup=true
dependent_startup_wait_for=push_mediamtx:running

[program:ffmpeg_kuaishou]
#标准推荐范围为 0-999 ‌默认值‌：‌999‌ ‌规则‌：‌数值越小，优先级越高，越先启动‌。
; priority=13
#创建该项目用户
user = root

#应用目录
directory = /python/supervisor_ffmpeg

#ffmpeg程序
command = ffmpeg -hide_banner -loglevel error -y -i rtmp://192.168.1.121:1935/show-rtc/abc123456 -c:v copy -c:a copy -f flv rtmp://39.96.29.167:1935/show-flv/abc123456

autostart = false #在supervisord启动的时候，false 表示不自动启动，true 表示随着启动
autorestart = true #程序异常退出后，false 表示不自动重启，true 表示自动重启
startsecs = 3 #稳定运行N秒后，从“正在启动”转成“正在运行”状态，值为0表示无需保持运行特定时长。
startretries = 3 #进程启动失败后，最大尝试的次数。当超过3次后，supervisor将把此进程的状态置为FATAL
stopasgroup = true #确保关闭supervisord时停止所有相关子进程
killasgroup = true #确保关闭supervisord时停止所有相关子进程

#日志目录必须事先存在，不然会出错
stdout_logfile = /python/logs/ffmpeg_kuaishou_out.log
stderr_logfile = /python/logs/ffmpeg_kuaishou_err.log

dependent_startup=true
dependent_startup_wait_for=push_mediamtx:running


[group:myapp_group1]
programs=mediamtx,push_mediamtx

[group:myapp_group2]
programs=ffmpeg_douyin,ffmpeg_kuaishou


#ffmpeg.conf 内容结束
